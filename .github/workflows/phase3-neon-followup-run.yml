name: Phase 3 Neon provenance follow-up runner

on:
  push:
    branches:
      - hardening/phase-3-open-source-readiness
    paths:
      - .github/workflows/phase3-neon-followup-run.yml

permissions:
  contents: write

jobs:
  audit-and-update:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Install audit dependency
        run: python -m pip install --disable-pip-version-check PyYAML==6.0.2

      - name: Run verified Neon follow-up
        run: python tools/phase3_neon_followup.py

      - name: Commit reviewed follow-up and remove temporary audit files
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/phase3-neon-followup.yml
          git rm .github/workflows/phase3-neon-followup-run.yml
          git rm tools/phase3_neon_followup.py
          git add Dokumentation/upstream-provenance.yml Dokumentation/open-source-readiness.yml Dokumentation/Open-Source-Readiness-2026-08-25.md SECURITY.md CHANGELOG.md
          echo "Changed paths:"
          git diff --cached --name-only
          if git diff --cached --name-only | grep -E '(^|/)SKILL\.md$|^Evals/|^Workflows/'; then
            echo "Unexpected Fach-/Eval-/Workflow change" >&2
            exit 1
          fi
          git diff --cached --check
          git commit -m "hardening: resolve Neon provenance review"
          git push origin HEAD:hardening/phase-3-open-source-readiness
