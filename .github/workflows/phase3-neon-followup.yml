name: Phase 3 Neon provenance follow-up

on:
  push:
    branches:
      - hardening/phase-3-open-source-readiness
    paths:
      - .github/workflows/phase3-neon-followup.yml

permissions:
  contents: write

jobs:
  audit-and-update:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Install audit dependency
        run: python -m pip install --disable-pip-version-check PyYAML==6.0.2

      - name: Verify exact Neon historical state
        shell: bash
        run: |
          set -euo pipefail
          NEON="$RUNNER_TEMP/neon-postgres-skills"
          git clone --filter=blob:none --no-checkout https://github.com/neondatabase/postgres-skills.git "$NEON"
          git -C "$NEON" fetch --depth=1 origin 0d9a967085c3bc137ab39ff9e3191c2eb3129d8c
          git -C "$NEON" checkout --detach FETCH_HEAD
          test "$(git -C "$NEON" rev-parse HEAD:skills/postgres-best-practices/SKILL.md)" = "43f3468765949e3db85a3782d90d4826b6c585bd"
          test "$(git -C "$NEON" rev-parse HEAD:LICENSE)" = "b87eca9ebe930dd536fc479611af31e1110c7434"
          if git -C "$NEON" ls-tree -r --name-only HEAD skills/postgres-best-practices | grep -Eiq '(^|/)(LICENSE|COPYING|NOTICE)([._-].*)?$'; then
            echo "Unexpected path-specific license/notice file found" >&2
            exit 1
          fi
          cp "$NEON/skills/postgres-best-practices/SKILL.md" "$RUNNER_TEMP/neon-SKILL.md"
          cp "$NEON/LICENSE" "$RUNNER_TEMP/neon-LICENSE"
          echo "Verified artifact blob 43f3468765949e3db85a3782d90d4826b6c585bd at 0d9a967085c3bc137ab39ff9e3191c2eb3129d8c"
          echo "Verified root Apache-2.0 LICENSE blob b87eca9ebe930dd536fc479611af31e1110c7434"
          echo "No path-specific LICENSE/COPYING/NOTICE under skills/postgres-best-practices/"

      - name: Run source-specific Local-Impact expression comparison
        env:
          UPSTREAM: ${{ runner.temp }}/neon-SKILL.md
        run: |
          python - <<'PY'
          import os
          from pathlib import Path
          from tools.open_source_readiness_audit import DERIVATION_RE, similarity_metrics

          upstream = Path(os.environ["UPSTREAM"]).read_text(encoding="utf-8")
          impacts = [
              Path("Datenbanken/Datenmodellierung-und-Zugriffsmuster.md"),
              Path("Datenbanken/Indizes-und-Execution-Plans.md"),
              Path("Datenbanken/Migrationen-Backfills-und-Rollback.md"),
          ]
          failed = False
          for path in impacts:
              local = path.read_text(encoding="utf-8")
              metrics = similarity_metrics(upstream, local)
              derivation = bool(DERIVATION_RE.search(local))
              print(
                  f"{path}: signal={metrics['signal']} "
                  f"exact_long_lines={metrics['exact_long_line_count']} "
                  f"common_12_word_shingles={metrics['common_12_word_shingle_count']} "
                  f"derivation_marker={derivation}"
              )
              if metrics["signal"] != "none" or derivation:
                  failed = True
          if failed:
              raise SystemExit("Concrete lexical/derivation signal found; do not apply reference-only classification")
          print("RESULT: no source-specific lexical or derivation signal in any registered local impact")
          PY

      - name: Apply reviewed Neon provenance and release-gate updates
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          def replace_once(text: str, pattern: str, replacement: str, label: str) -> str:
              new, count = re.subn(pattern, replacement, text, count=1, flags=re.M | re.S)
              if count != 1:
                  raise SystemExit(f"{label}: expected exactly one replacement, got {count}")
              return new

          provenance_path = Path("Dokumentation/upstream-provenance.yml")
          provenance = provenance_path.read_text(encoding="utf-8")
          neon_block = '''- source_id: neon-postgres-best-practices
  reviewed_at: 2026-08-26
  repository_commit: 0d9a967085c3bc137ab39ff9e3191c2eb3129d8c
  use_class: reference/inspiration
  review_status: assessed
  material_scope: concepts/methods-only
  classification_evidence:
  - The observed Neon artifact blob was independently mapped to repository commit 0d9a967085c3bc137ab39ff9e3191c2eb3129d8c.
  - Source-specific comparison against all three registered local impacts found no exact long-line, 12-word-shingle or explicit derivation-marker signal; manual review found only generic topic overlap, not distinctive translated or structural expression.
  - The local use is therefore classified as concepts/methods reference only; Apache-2.0 redistribution permission is documented as same-state evidence but is not relied on for the local classification.
  similarity_audit: no-signal
  redistribution_reliance: not-relied-on
  license_spdx: Apache-2.0
  license_source: https://github.com/neondatabase/postgres-skills/blob/0d9a967085c3bc137ab39ff9e3191c2eb3129d8c/LICENSE
  license_source_commit_or_ref: 0d9a967085c3bc137ab39ff9e3191c2eb3129d8c
  license_path: LICENSE
  license_blob_sha: b87eca9ebe930dd536fc479611af31e1110c7434
  path_specific_license_notes:
  - Same-state audit verified the root Apache-2.0 LICENSE and found no LICENSE, COPYING or NOTICE override under skills/postgres-best-practices/.
  license_status_at_observation: Apache-2.0 root license verified at the exact repository commit containing the observed artifact blob; no path-specific conflicting license was detected. The license is recorded as historical evidence and is not relied on for reference-only use.
  notice_requirement: none-for-reference-only
  redistribution_status: not-relied-on
  license_evidence:
    artifact_declarations: []
    same_state_files:
    - path: LICENSE
      blob_sha: b87eca9ebe930dd536fc479611af31e1110c7434
      spdx: Apache-2.0
    notes:
    - The observed artifact blob 43f3468765949e3db85a3782d90d4826b6c585bd is present at repository commit 0d9a967085c3bc137ab39ff9e3191c2eb3129d8c.
    - The root LICENSE was fetched and verified from the same commit.
    - No concrete expression reliance was found in the registered local impacts, so Apache-2.0 redistribution permission is not required for the local reference-only classification.
  source_snapshot:
    repository: neondatabase/postgres-skills
    source_path: skills/postgres-best-practices/SKILL.md
    observed_ref: main
    observed_blob_sha: 43f3468765949e3db85a3782d90d4826b6c585bd
'''
          provenance = replace_once(
              provenance,
              r'^- source_id: neon-postgres-best-practices\n.*?(?=^- source_id: mattpocock-code-review\n)',
              neon_block,
              "Neon provenance block",
          )
          provenance = provenance.replace("last_reviewed: 2026-08-25", "last_reviewed: 2026-08-26", 1)
          provenance_path.write_text(provenance, encoding="utf-8")

          readiness_path = Path("Dokumentation/open-source-readiness.yml")
          readiness = readiness_path.read_text(encoding="utf-8")
          provenance_ready = '''  provenance:
    status: ready
    evidence:
      - 65 GitHub artifacts were reviewed source-by-source in Phase 3.
      - Every provenance decision is bound to the exact reviewed source snapshot (repository, source path, observed ref and observed blob SHA); the permanent validator fails on any registry/provenance snapshot mismatch and requires explicit re-review.
      - 61 records are assessed as reference/inspiration with no redistribution reliance.
      - neon-postgres-best-practices is now assessed as reference/inspiration after its observed blob was mapped to repository commit 0d9a967085c3bc137ab39ff9e3191c2eb3129d8c and source-specific comparison found no concrete expression signal; the same-state root LICENSE is Apache-2.0 blob b87eca9ebe930dd536fc479611af31e1110c7434.
      - Four Matt Pocock artifacts are individually assessed as adapted with their own observed-blob snapshots, exact repository-commit mapping and same-state MIT license evidence.
      - THIRD-PARTY-NOTICES.md carries the required MIT notice for those four adaptations; the Neon reference-only record requires no redistribution notice.
    blockers: []
'''
          readiness = replace_once(readiness, r'^  provenance:\n.*?(?=^  licensing:\n)', provenance_ready, "readiness provenance")
          security_reporting = '''  security_reporting:
    status: blocked
    private_reporting_channel_configured: false
    evidence:
      - SECURITY.md requires a private vulnerability-reporting path before public release.
      - GitHub documents Private Vulnerability Reporting for public repositories, so the current private-repository state is not treated as a missing pre-publication setting that can simply be enabled now.
      - The Phase-4 release sequence must enable Private Vulnerability Reporting after the visibility change, verify that private reporting works, and then confirm SECURITY.md; an explicitly approved alternative private channel may close this gate earlier.
    blockers:
      - Phase 4 must establish and verify a private reporting path before the public release is considered complete; GitHub Private Vulnerability Reporting can be enabled after the repository becomes public, or an authorized alternative channel can be documented earlier.
'''
          readiness = replace_once(readiness, r'^  security_reporting:\n.*?(?=^  repository_hygiene:\n)', security_reporting, "readiness security reporting")
          release_gate = '''release_gate:
  status: blocked
  blockers:
    - Root project license is blocked on an authorized Rights Holder decision to publish the project-owned KI-Regeln material under MIT.
    - A verified private vulnerability-reporting path is still required as a Phase-4 release step; GitHub Private Vulnerability Reporting can be enabled after the repository becomes public, or an authorized alternative channel can close the gate earlier.
'''
          readiness = replace_once(readiness, r'^release_gate:\n.*\Z', release_gate, "readiness release gate")
          readiness_path.write_text(readiness, encoding="utf-8")

          report_path = Path("Dokumentation/Open-Source-Readiness-2026-08-25.md")
          report = report_path.read_text(encoding="utf-8")
          report = report.replace(
              '- 60 × `reference/inspiration`, `review_status: assessed`, keine Redistributionsabhängigkeit;\n- 4 × `adapted`, jeweils separat belegt und MIT-Notice-pflichtig;\n- 1 × `needs-human/legal-review` mit bewusst offenem `use_class: unclear`.\n\nDer automatische Ähnlichkeitscheck ist nur ein Signal. `assessed` wurde erst nach Review vergeben; ein offener Zweifelsfall bleibt ausdrücklich offen.',
              '- 61 × `reference/inspiration`, `review_status: assessed`, keine Redistributionsabhängigkeit;\n- 4 × `adapted`, jeweils separat belegt und MIT-Notice-pflichtig;\n- 0 × `needs-human/legal-review`.\n\nDer automatische Ähnlichkeitscheck ist nur ein Signal. `assessed` wurde erst nach source-spezifischem Review vergeben; die Use-Class wurde nicht allein aus einer vorhandenen Lizenz abgeleitet.',
              1,
          )
          neon_section = '''## Neon – aufgelöster Provenance-Fall

Der zuvor offene Fall `neon-postgres-best-practices` wurde am 2026-08-26 source-spezifisch nachgeprüft.

Der registrierte Blob `43f3468765949e3db85a3782d90d4826b6c585bd` ist Bestandteil des Repository-Commits `0d9a967085c3bc137ab39ff9e3191c2eb3129d8c` in `neondatabase/postgres-skills`. Am exakt selben Commit liegt die Root-`LICENSE` als Apache License 2.0 mit Blob `b87eca9ebe930dd536fc479611af31e1110c7434`. Unter `skills/postgres-best-practices/` wurde in diesem Zustand keine abweichende `LICENSE`-, `COPYING`- oder `NOTICE`-Datei gefunden.

Die Lizenz wurde nicht als Abkürzung für die Use-Class verwendet. Der registrierte historische `SKILL.md`-Text wurde gegen jede der drei Local-Impact-Dateien einzeln mit demselben Long-Line-/12-Wort-Shingle-Verfahren wie im Phase-3-Audit verglichen. Ergebnis: kein exaktes Long-Line-Signal, kein 12-Wort-Shingle-Signal und kein expliziter Derivation-Marker. Die manuelle Gegenprüfung sieht nur generische Themenüberschneidungen wie Datenmodellierung, Indizes/Query-Optimierung und Migrationen; die lokalen Texte sind eigenständig deutsch formuliert und enthalten keine charakteristische übersetzte oder strukturelle Ausdrucksübernahme aus dem registrierten Upstream-Artefakt.

Finale Klassifikation:

- `review_status: assessed`;
- `use_class: reference/inspiration`;
- `material_scope: concepts/methods-only`;
- `redistribution_reliance: not-relied-on`;
- `redistribution_status: not-relied-on`;
- `license_spdx: Apache-2.0` als same-state historische Evidence, nicht als benötigte Redistributionsfreigabe.

Damit verbleibt kein `needs-human/legal-review`-Provenance-Record.

## Exposure-Audit
'''
          report = replace_once(report, r'^## Offener Provenance-Fall\n.*?(?=^## Exposure-Audit\n)', neon_section, "report Neon section")
          security_section = '''## Security Reporting

`SECURITY.md` ist vorhanden. Ein privater Vulnerability-Reporting-Kanal ist im aktuellen privaten Repositoryzustand noch nicht festgelegt.

Das wird nicht als technisch jetzt schon aktivierbare GitHub-Einstellung dargestellt: GitHub dokumentiert Private Vulnerability Reporting für **öffentliche** Repositories. Der zwingende Phase-4-Release-Schritt lautet daher: nach dem Visibility-Wechsel Private Vulnerability Reporting aktivieren, die Funktion praktisch prüfen und anschließend `SECURITY.md` bestätigen. Wird vorher ein anderer autorisierter privater Meldekanal festgelegt und dokumentiert, kann dieses Gate entsprechend früher geschlossen werden.

Bis einer dieser Wege tatsächlich verifiziert ist, bleibt Security Reporting ein Public-Release-Gate.

## Repository-Hygiene und Supply Chain
'''
          report = replace_once(report, r'^## Security Reporting\n.*?(?=^## Repository-Hygiene und Supply Chain\n)', security_section, "report security section")
          report = report.replace(
              'Das Repository selbst ist trotz erfolgreichem Phase-3-Hardening **noch nicht Public-Release-ready**, solange mindestens diese menschlichen Blocker offen sind:\n\n1. `neon-postgres-best-practices` – Provenance/Legal Review;\n2. Rights-Holder-/Root-License-Entscheidung;\n3. privater Security-Reporting-Kanal.\n\nKeiner dieser Punkte darf durch Automatisierung als erledigt markiert werden.',
              'Das Repository selbst ist trotz erfolgreichem Phase-3-Hardening **noch nicht Public-Release-ready**, solange diese Release-Gates offen sind:\n\n1. Rights-Holder-/Root-License-Entscheidung: Ein autorisierter Projekt-/Rights-Holder muss ausdrücklich freigeben, das eigene KI-Regeln-Material unter MIT zu veröffentlichen;\n2. privater Security-Reporting-Pfad: in Phase 4 nach dem Visibility-Wechsel GitHub Private Vulnerability Reporting aktivieren, Funktion prüfen und `SECURITY.md` bestätigen – oder vorher einen autorisierten alternativen privaten Kanal dokumentieren.\n\nDer frühere Neon-Provenance-Blocker ist source-spezifisch aufgelöst. Keines der verbleibenden Gates darf durch Automatisierung als erledigt markiert werden.',
              1,
          )
          report_path.write_text(report, encoding="utf-8")

          security_path = Path("SECURITY.md")
          security = security_path.read_text(encoding="utf-8")
          old = '''Für den aktuellen privaten Projektstand ist **noch kein belastbar dokumentierter privater Security-Meldekanal festgelegt**. Vor einer Umstellung auf ein öffentliches Repository muss deshalb entweder GitHubs Private Vulnerability Reporting aktiviert oder ein anderer privater Meldekanal ausdrücklich festgelegt und hier dokumentiert werden.

Bis dieses Gate geschlossen ist, ist die Public-Release-Readiness im Bereich Security Reporting nur teilweise erfüllt.'''
          new = '''Für den aktuellen privaten Projektstand ist **noch kein belastbar dokumentierter privater Security-Meldekanal festgelegt**. GitHub Private Vulnerability Reporting ist laut GitHub-Dokumentation für öffentliche Repositories vorgesehen und wird deshalb nicht als im privaten Vorbereitungszustand bereits aktivierbares Pflicht-Setting behandelt.

Verbindlicher Phase-4-Release-Schritt: Nach dem Visibility-Wechsel Private Vulnerability Reporting aktivieren, praktisch prüfen, dass ein privater Reportweg funktioniert, und anschließend diese `SECURITY.md`-Anleitung bestätigen beziehungsweise ergänzen. Falls vor dem Visibility-Wechsel ein anderer autorisierter privater Meldekanal festgelegt und dokumentiert wird, kann das Gate entsprechend früher geschlossen werden.

Bis ein privater Meldeweg tatsächlich eingerichtet und verifiziert ist, bleibt die Public-Release-Readiness im Bereich Security Reporting blockiert.'''
          if old not in security:
              raise SystemExit("SECURITY.md expected reporting paragraph not found")
          security_path.write_text(security.replace(old, new, 1), encoding="utf-8")

          changelog_path = Path("CHANGELOG.md")
          changelog = changelog_path.read_text(encoding="utf-8")
          old = '- alle 65 konkreten GitHub-Upstream-Artefakte source-spezifisch auditiert und `Dokumentation/upstream-provenance.yml` migriert: 60× abschließend `reference/inspiration` ohne Redistributionsabhängigkeit, vier Matt-Pocock-Artefakte jeweils separat als `adapted` mit observed-Blob→Repository-Commit- und same-state-MIT-Evidence, ein Neon-Fall bewusst `needs-human/legal-review`;'
          new = '- alle 65 konkreten GitHub-Upstream-Artefakte source-spezifisch auditiert und `Dokumentation/upstream-provenance.yml` migriert: final 61× `reference/inspiration` ohne Redistributionsabhängigkeit und vier Matt-Pocock-Artefakte jeweils separat als `adapted`; der zunächst offene Neon-Fall wurde nach Auflösung des historischen Blob→Commit-Mappings per Local-Impact-/Expression-Vergleich als `assessed / reference/inspiration` abgeschlossen und trägt same-state Apache-2.0-Evidence;'
          if old not in changelog:
              raise SystemExit("CHANGELOG Neon summary not found")
          changelog = changelog.replace(old, new, 1)
          old2 = '- Root-`LICENSE` bewusst nicht allein aus der MIT-Empfehlung erzeugt: Rights-Holder-/Projektlizenzentscheidung bleibt menschlicher Blocker; ebenso bleibt ein fehlender privater Security-Reporting-Kanal sichtbar blockiert;'
          new2 = '- Root-`LICENSE` bewusst nicht allein aus der MIT-Empfehlung erzeugt: ausdrückliche Rights-Holder-/Projektlizenzentscheidung bleibt Blocker; Security Reporting bleibt bis zu einem verifizierten privaten Meldeweg blockiert, wobei GitHub Private Vulnerability Reporting als Phase-4-Schritt nach dem Visibility-Wechsel behandelt wird und ein autorisierter alternativer privater Kanal das Gate früher schließen kann;'
          if old2 not in changelog:
              raise SystemExit("CHANGELOG release-gate summary not found")
          changelog_path.write_text(changelog.replace(old2, new2, 1), encoding="utf-8")
          PY

      - name: Commit reviewed follow-up and remove temporary workflow
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/phase3-neon-followup.yml
          git add Dokumentation/upstream-provenance.yml Dokumentation/open-source-readiness.yml Dokumentation/Open-Source-Readiness-2026-08-25.md SECURITY.md CHANGELOG.md
          echo "Changed paths:"
          git diff --cached --name-only
          if git diff --cached --name-only | grep -E '(^|/)SKILL\.md$|^Evals/|^Workflows/'; then
            echo "Unexpected Fach-/Eval-/Workflow change" >&2
            exit 1
          fi
          git diff --cached --check
          git commit -m "hardening: resolve Neon provenance review"
          git push origin HEAD:hardening/phase-3-open-source-readiness
