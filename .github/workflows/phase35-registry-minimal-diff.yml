name: Phase 3.5 registry minimal diff

on:
  push:
    branches:
      - hardening/phase-3-5-webdesign-motion
    paths:
      - .phase35-registry-minimal-trigger

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          ref: hardening/phase-3-5-webdesign-motion
          fetch-depth: 0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check PyYAML==6.0.2 jsonschema==4.25.1
      - name: Rebuild registry from exact base plus structured additions
        run: |
          git show 36b55acb51c3a98f72e340c03f2af75788c65e7f:Dokumentation/upstream-sources.yml > /tmp/upstream-sources.base.yml
          python - <<'PY'
          from pathlib import Path
          from copy import deepcopy
          import yaml

          class IndentDumper(yaml.SafeDumper):
              def increase_indent(self, flow=False, indentless=False):
                  return super().increase_indent(flow, False)

          def first_diff(a, b, path='$'):
              if type(a) is not type(b):
                  return f'{path}: type {type(a).__name__} != {type(b).__name__}: {a!r} != {b!r}'
              if isinstance(a, dict):
                  if set(a) != set(b):
                      return f'{path}: keys differ: only-left={sorted(set(a)-set(b))}, only-right={sorted(set(b)-set(a))}'
                  for key in a:
                      diff = first_diff(a[key], b[key], f'{path}.{key}')
                      if diff:
                          return diff
                  return None
              if isinstance(a, list):
                  if len(a) != len(b):
                      return f'{path}: list length {len(a)} != {len(b)}'
                  for idx, (left, right) in enumerate(zip(a, b)):
                      diff = first_diff(left, right, f'{path}[{idx}]')
                      if diff:
                          return diff
                  return None
              if a != b:
                  return f'{path}: {a!r} != {b!r}'
              return None

          current_path = Path('Dokumentation/upstream-sources.yml')
          base_path = Path('/tmp/upstream-sources.base.yml')
          ids = [
              'emil-kowalski-motion-craft',
              'mblode-ui-animation',
              'taste-design-parameters',
          ]

          current_text = current_path.read_text(encoding='utf-8')
          base_text = base_path.read_text(encoding='utf-8')
          current = yaml.safe_load(current_text)
          base = yaml.safe_load(base_text)
          if not isinstance(current, dict) or not isinstance(base, dict):
              raise SystemExit('registry documents must be mappings')
          if not isinstance(current.get('sources'), list) or not isinstance(base.get('sources'), list):
              raise SystemExit('registry sources must be lists')
          if current.get('policy') != base.get('policy'):
              raise SystemExit('policy drift detected')

          base_ids = {record.get('id') for record in base['sources'] if isinstance(record, dict)}
          current_ids = {record.get('id') for record in current['sources'] if isinstance(record, dict)}
          if current_ids != base_ids | set(ids):
              raise SystemExit('registry differs from base by more than the three approved IDs')

          additions = []
          for source_id in ids:
              matches = [record for record in current['sources'] if isinstance(record, dict) and record.get('id') == source_id]
              if len(matches) != 1:
                  raise SystemExit(f'expected exactly one record for {source_id}')
              additions.append(matches[0])

          expected = deepcopy(base)
          expected['last_updated'] = current['last_updated']
          expected['sources'].extend(additions)
          if expected != current:
              raise SystemExit('current registry already differs semantically from base + approved records: ' + str(first_diff(expected, current)))

          root = yaml.compose(base_text)
          if not isinstance(root, yaml.MappingNode):
              raise SystemExit('base registry root must be a mapping node')
          nodes = {key.value: value for key, value in root.value if isinstance(key, yaml.ScalarNode)}
          sources_node = nodes.get('sources')
          last_updated_node = nodes.get('last_updated')
          if not isinstance(sources_node, yaml.SequenceNode) or not sources_node.value:
              raise SystemExit('base sources node must be a non-empty sequence')
          if not isinstance(last_updated_node, yaml.ScalarNode):
              raise SystemExit('base last_updated must be a scalar')

          rendered = yaml.dump(
              {'sources': additions},
              Dumper=IndentDumper,
              sort_keys=False,
              allow_unicode=True,
              width=120,
              default_flow_style=False,
          )
          header = 'sources:\n'
          if not rendered.startswith(header):
              raise SystemExit('unexpected serializer shape for additions')
          addition_text = rendered[len(header):]
          if not addition_text.endswith('\n'):
              addition_text += '\n'

          operations = [
              (sources_node.value[-1].end_mark.index, sources_node.value[-1].end_mark.index, '\n' + addition_text),
              (last_updated_node.start_mark.index, last_updated_node.end_mark.index, "'2026-08-26'"),
          ]
          rebuilt = base_text
          for start, end, replacement in sorted(operations, reverse=True):
              rebuilt = rebuilt[:start] + replacement + rebuilt[end:]

          rewritten = yaml.safe_load(rebuilt)
          if rewritten != current:
              raise SystemExit('minimal rebuild changed registry semantics: ' + str(first_diff(rewritten, current)))
          current_path.write_text(rebuilt, encoding='utf-8')
          PY
          python tools/repo_validator.py
          git diff --stat 36b55acb51c3a98f72e340c03f2af75788c65e7f -- Dokumentation/upstream-sources.yml
      - name: Commit repair and self-clean
        run: |
          rm -f .github/workflows/phase35-registry-minimal-diff.yml .phase35-registry-minimal-trigger
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Dokumentation/upstream-sources.yml .github/workflows/phase35-registry-minimal-diff.yml .phase35-registry-minimal-trigger
          git commit -m "chore: restore minimal Phase 3.5 registry diff"
          git push origin HEAD:hardening/phase-3-5-webdesign-motion
