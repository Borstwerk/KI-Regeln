name: Repo validation

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Install validator dependencies
        run: python -m pip install --disable-pip-version-check PyYAML==6.0.2 jsonschema==4.25.1
      - name: Validate repository
        run: python tools/repo_validator.py
      - name: Portable verification report contract tests (synthetic, model-free)
        run: python -m unittest tests.test_verification_run_contract
      - name: Offline HTML report renderer tests (synthetic, no browser)
        run: python -m unittest tests.test_verification_report_html
      - name: Public entrypoint navigation and language structure (no translation claim)
        run: |
          python -m unittest tests.test_public_entrypoints
          python -m unittest tests.test_corrected_discovery
          python -m unittest tests.test_rule_search
          python -m unittest tests.test_rule_search_routing
          python -m unittest tests.test_rule_search_facets
          python -m unittest tests.test_rule_search_paging
          python -m unittest tests.test_rule_relations tests.test_rule_search_relations
          python tools/check_public_entrypoints.py
      - name: GT-01 blind handoff and GT-04 preparation (offline; no model)
        run: python -m unittest tests.test_gt_product_pilots
      - name: Behavioral harness unit tests
        run: python -m unittest tests.test_behavioral_harness tests.test_golden_task_behavioral_harness tests.test_behavioral_harness_claude
      - name: Verification governance portable checks (no CLI, namespace or model evidence)
        run: python tools/b2_test_runner.py --portable
      - name: Outcome pilot unit tests
        run: python -m unittest tests.test_outcome_pilot
      - name: UI reference pilot packaging and negative controls (offline, no model)
        run: python -m unittest tests.test_ui_reference_pilot
      - name: PT-01 Ponytail seeded fixtures and offline negative controls (no model)
        run: |
          python -m unittest tests.test_pt01_pilot
          python tools/pt01_pilot.py selftest
      - name: Task-to-Playbook workflow and PB-01 structural negative controls (no model)
        run: python -m unittest tests.test_task_to_playbook_workflow
      - name: Guided workflow offline demonstration contract checks (no browser)
        run: python -m unittest tests.test_guided_workflow_demo
      - name: Prompt engineering pilot static cases and negative controls (no model)
        run: python -m unittest tests.test_prompt_engineering_pilot
      - name: Skill redundancy audit unit tests
        run: python -m unittest tests.test_skill_redundancy_audit
      - name: Skill redundancy candidates (informational, no quality gate)
        run: python tools/skill_redundancy_audit.py --repo . --limit 10
      - name: Prepare blind Golden Task packages
        shell: bash
        run: |
          set -euo pipefail
          tmp="$(mktemp -d)"
          for n in 09 10 11 12 13 14 15 16 17 18; do
            python tools/golden_task_behavioral_harness.py prepare-case               "Evals/Golden-Tasks/GT-${n}/task.yml"               --repo-commit "$GITHUB_SHA"               --out "$tmp/GT-${n}"
          done
