name: Repo validation

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Install validator dependencies
        run: python -m pip install --disable-pip-version-check PyYAML==6.0.2 jsonschema==4.25.1
      - name: Validate repository
        run: python tools/repo_validator.py
      - name: Behavioral blindness unit tests
        run: python -m unittest tests.test_golden_task_behavioral_harness tests.test_behavioral_harness_claude
      - name: Prepare blind Golden Task packages
        shell: bash
        run: |
          set -euo pipefail
          tmp="$(mktemp -d)"
          for n in 09 10 11 12 13 14 15 16 17; do
            python tools/golden_task_behavioral_harness.py prepare-case               "Evals/Golden-Tasks/GT-${n}/task.yml"               --repo-commit "$GITHUB_SHA"               --out "$tmp/GT-${n}"
          done
