name: Phase 2 validator head check

on:
  push:
    branches:
      - hardening/phase-2-evals-golden-tasks

permissions:
  contents: read

jobs:
  validate-head:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout target head
        uses: actions/checkout@v4
        with:
          ref: 7e26d3e30d14ea1b7726279404da82b3038577c9
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install validator dependencies
        run: python -m pip install --disable-pip-version-check PyYAML==6.0.2 jsonschema==4.25.1
      - name: Validate repository at required head
        run: |
          test "$(git rev-parse HEAD)" = "7e26d3e30d14ea1b7726279404da82b3038577c9"
          python tools/repo_validator.py
