name: Native verification pilot

on:
  pull_request:
    paths:
      - "Evals/Verification-Portable/**"
      - "Schemas/verification-run.schema.json"
      - "tools/verification_report_html.py"
      - "tests/test_native_verification_pilot.py"
      - ".github/workflows/native-verification-pilot.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke:
    name: Native pilot (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: pwsh
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - name: Set up Python for report validation only
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Install report schema dependency
        run: python -m pip install --disable-pip-version-check jsonschema==4.25.1
      - name: Execute native PowerShell fixture
        run: pwsh -NoProfile -NonInteractive -File Evals/Verification-Portable/Run-Pilot.ps1 -Scenario powershell -Report .validation/pilot/powershell.json
      - name: Execute native .NET fixture
        run: pwsh -NoProfile -NonInteractive -File Evals/Verification-Portable/Run-Pilot.ps1 -Scenario dotnet -Report .validation/pilot/dotnet.json
      - name: Controlled missing-runtime negative observation
        run: pwsh -NoProfile -NonInteractive -File Evals/Verification-Portable/Run-Pilot.ps1 -Scenario missing-runtime -Report .validation/pilot/missing-runtime.json
      - name: Independently validate reports and native evidence
        run: python -m unittest tests.test_native_verification_pilot
      - name: Render three standalone HTML reports
        run: |
          python tools/verification_report_html.py --input .validation/pilot/powershell.json --output .validation/pilot/powershell.html
          python tools/verification_report_html.py --input .validation/pilot/dotnet.json --output .validation/pilot/dotnet.html
          python tools/verification_report_html.py --input .validation/pilot/missing-runtime.json --output .validation/pilot/missing-runtime.html
      - name: Upload synthetic pilot reports (JSON + HTML only)
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: native-verification-${{ matrix.os }}
          path: |
            .validation/pilot/*.json
            .validation/pilot/*.html
          if-no-files-found: error
          retention-days: 7
