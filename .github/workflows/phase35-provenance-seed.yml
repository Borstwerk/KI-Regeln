name: Phase 3.5 provenance seed

on:
  push:
    branches:
      - hardening/phase-3-5-webdesign-motion
    paths:
      - .phase35-provenance-trigger

permissions:
  contents: write

jobs:
  seed:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          ref: hardening/phase-3-5-webdesign-motion
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check PyYAML==6.0.2 jsonschema==4.25.1
      - name: Append reviewed sources and provenance structurally
        run: |
          python - <<'PY'
          from pathlib import Path
          import yaml

          registry_path = Path('Dokumentation/upstream-sources.yml')
          provenance_path = Path('Dokumentation/upstream-provenance.yml')
          audit_path = Path('Dokumentation/Webdesign-Motion-Audit-Phase-3-5.md')

          if not audit_path.is_file():
              raise SystemExit(f'missing audit report: {audit_path}')

          registry = yaml.safe_load(registry_path.read_text(encoding='utf-8'))
          provenance = yaml.safe_load(provenance_path.read_text(encoding='utf-8'))

          if not isinstance(registry, dict):
              raise SystemExit('upstream-sources.yml must load as a mapping')
          if not isinstance(provenance, dict):
              raise SystemExit('upstream-provenance.yml must load as a mapping')
          if not isinstance(registry.get('sources'), list):
              raise SystemExit('registry["sources"] must be a list')
          if not isinstance(provenance.get('sources'), list):
              raise SystemExit('provenance["sources"] must be a list')

          source_records = [
              {
                  'id': 'emil-kowalski-motion-craft',
                  'area': 'Webentwicklung',
                  'kind': 'github-file',
                  'repository': 'emilkowalski/skills',
                  'path': 'skills/animate/SKILL.md',
                  'ref': 'main',
                  'monitor_mode': 'exact-sha',
                  'cadence': 'monthly',
                  'observed_sha': '159fe0753228ab9d43fce274bd2c24433f3c4771',
                  'last_checked': '2026-08-26',
                  'local_impact': ['Dokumentation/Webdesign-Motion-Audit-Phase-3-5.md'],
              },
              {
                  'id': 'mblode-ui-animation',
                  'area': 'Webentwicklung',
                  'kind': 'github-file',
                  'repository': 'mblode/agent-skills',
                  'path': 'skills/ui-animation/SKILL.md',
                  'ref': 'main',
                  'monitor_mode': 'exact-sha',
                  'cadence': 'monthly',
                  'observed_sha': '9c771273462e5ad42687e8d7240ef786e115fd71',
                  'last_checked': '2026-08-26',
                  'local_impact': ['Dokumentation/Webdesign-Motion-Audit-Phase-3-5.md'],
              },
              {
                  'id': 'taste-design-parameters',
                  'area': 'Webentwicklung',
                  'kind': 'github-file',
                  'repository': 'Leonxlnx/taste-skill',
                  'path': 'skills/taste-skill/SKILL.md',
                  'ref': 'main',
                  'monitor_mode': 'exact-sha',
                  'cadence': 'monthly',
                  'observed_sha': 'b72132fcd466da605623ffe96e370b3991fc5285',
                  'last_checked': '2026-08-26',
                  'local_impact': ['Dokumentation/Webdesign-Motion-Audit-Phase-3-5.md'],
              },
          ]

          provenance_records = [
              {
                  'source_id': 'emil-kowalski-motion-craft',
                  'reviewed_at': '2026-08-26',
                  'repository_commit': 'd23d7f88a2e21c9e4b1418c7abe420f5c1052ba7',
                  'use_class': 'reference/inspiration',
                  'review_status': 'assessed',
                  'material_scope': 'concepts/methods-only',
                  'classification_evidence': [
                      'Phase-3.5 source-specific review uses purpose, frequency, spatial-continuity and interruptibility concepts without copying source wording, fixed timing rules or source structure.',
                      'Author-specific duration, easing and performance absolutes were explicitly rejected as universal local truth.',
                  ],
                  'similarity_audit': 'no-signal',
                  'redistribution_reliance': 'not-relied-on',
                  'license_spdx': 'MIT',
                  'license_source': 'same-state root LICENSE',
                  'license_source_commit_or_ref': 'd23d7f88a2e21c9e4b1418c7abe420f5c1052ba7',
                  'license_path': 'LICENSE',
                  'license_blob_sha': '57b46f1fd11dc62351ea548104a88aa3f659c11b',
                  'path_specific_license_notes': [
                      'No conflicting path-specific license file was found for skills/animate in the reviewed tree.'
                  ],
                  'license_status_at_observation': 'MIT evidence recorded; redistribution permission not relied on for reference-only use',
                  'notice_requirement': 'none-for-reference-only',
                  'redistribution_status': 'not-relied-on',
                  'license_evidence': {
                      'artifact_declarations': [],
                      'same_state_files': [
                          {'path': 'LICENSE', 'blob_sha': '57b46f1fd11dc62351ea548104a88aa3f659c11b', 'spdx': 'MIT'}
                      ],
                      'notes': [
                          'Same-state MIT evidence is provenance evidence only; the local material is independently worded reference use.'
                      ],
                  },
                  'source_snapshot': {
                      'repository': 'emilkowalski/skills',
                      'source_path': 'skills/animate/SKILL.md',
                      'observed_ref': 'main',
                      'observed_blob_sha': '159fe0753228ab9d43fce274bd2c24433f3c4771',
                  },
              },
              {
                  'source_id': 'mblode-ui-animation',
                  'reviewed_at': '2026-08-26',
                  'repository_commit': 'e97a3b383f5944f90d41eb92b24b4fb3b917a7f9',
                  'use_class': 'reference/inspiration',
                  'review_status': 'assessed',
                  'material_scope': 'concepts/methods-only',
                  'classification_evidence': [
                      'Phase-3.5 review uses gesture, choreography and evidence/reverse-engineering concepts without copying source wording or workflow structure.',
                      'Emil-like craft heuristics in this source are treated as dependent evidence and are not double-counted as independent consensus.',
                  ],
                  'similarity_audit': 'no-signal',
                  'redistribution_reliance': 'not-relied-on',
                  'license_spdx': 'MIT',
                  'license_source': 'same-state root LICENSE.md',
                  'license_source_commit_or_ref': 'e97a3b383f5944f90d41eb92b24b4fb3b917a7f9',
                  'license_path': 'LICENSE.md',
                  'license_blob_sha': 'c5a1d56c6d623c72d077f8aab56b31d7dc371cbb',
                  'path_specific_license_notes': [
                      'No conflicting path-specific license file was found for skills/ui-animation in the reviewed tree.'
                  ],
                  'license_status_at_observation': 'MIT evidence recorded; redistribution permission not relied on for reference-only use',
                  'notice_requirement': 'none-for-reference-only',
                  'redistribution_status': 'not-relied-on',
                  'license_evidence': {
                      'artifact_declarations': [],
                      'same_state_files': [
                          {'path': 'LICENSE.md', 'blob_sha': 'c5a1d56c6d623c72d077f8aab56b31d7dc371cbb', 'spdx': 'MIT'}
                      ],
                      'notes': [
                          'Same-state MIT evidence is provenance evidence only; local use is concepts/methods reference.'
                      ],
                  },
                  'source_snapshot': {
                      'repository': 'mblode/agent-skills',
                      'source_path': 'skills/ui-animation/SKILL.md',
                      'observed_ref': 'main',
                      'observed_blob_sha': '9c771273462e5ad42687e8d7240ef786e115fd71',
                  },
              },
              {
                  'source_id': 'taste-design-parameters',
                  'reviewed_at': '2026-08-26',
                  'repository_commit': 'ccbc15639c97057cbfcf32ecebc38ef716e4bb37',
                  'use_class': 'reference/inspiration',
                  'review_status': 'assessed',
                  'material_scope': 'concepts/methods-only',
                  'classification_evidence': [
                      'Only the abstract idea of making fuzzy design direction explicit through multiple parameters is used; source names, scales, defaults and taste judgments are not copied.',
                      'UI UX Pro Max is documented as genealogically dependent on Taste for the three-slider idea and is not counted as independent consensus.',
                  ],
                  'similarity_audit': 'no-signal',
                  'redistribution_reliance': 'not-relied-on',
                  'license_spdx': 'MIT',
                  'license_source': 'same-state root LICENSE',
                  'license_source_commit_or_ref': 'ccbc15639c97057cbfcf32ecebc38ef716e4bb37',
                  'license_path': 'LICENSE',
                  'license_blob_sha': '48a2f6640b81ff8eca9ce7f6a96337692713ef5b',
                  'path_specific_license_notes': [
                      'No conflicting path-specific license file was found for skills/taste-skill in the reviewed tree.'
                  ],
                  'license_status_at_observation': 'MIT evidence recorded; redistribution permission not relied on for reference-only use',
                  'notice_requirement': 'none-for-reference-only',
                  'redistribution_status': 'not-relied-on',
                  'license_evidence': {
                      'artifact_declarations': [],
                      'same_state_files': [
                          {'path': 'LICENSE', 'blob_sha': '48a2f6640b81ff8eca9ce7f6a96337692713ef5b', 'spdx': 'MIT'}
                      ],
                      'notes': [
                          'Same-state MIT evidence is provenance evidence only; local use is independently modeled concepts/methods reference.'
                      ],
                  },
                  'source_snapshot': {
                      'repository': 'Leonxlnx/taste-skill',
                      'source_path': 'skills/taste-skill/SKILL.md',
                      'observed_ref': 'main',
                      'observed_blob_sha': 'b72132fcd466da605623ffe96e370b3991fc5285',
                  },
              },
          ]

          existing_registry_ids = {record.get('id') for record in registry['sources'] if isinstance(record, dict)}
          existing_provenance_ids = {record.get('source_id') for record in provenance['sources'] if isinstance(record, dict)}
          new_ids = {record['id'] for record in source_records}
          if new_ids & existing_registry_ids:
              raise SystemExit(f'duplicate registry IDs: {sorted(new_ids & existing_registry_ids)}')
          if new_ids & existing_provenance_ids:
              raise SystemExit(f'duplicate provenance IDs: {sorted(new_ids & existing_provenance_ids)}')

          policy_before = registry.get('policy')
          existing_registry_count = len(registry['sources'])
          existing_provenance_count = len(provenance['sources'])

          registry['sources'].extend(source_records)
          provenance['sources'].extend(provenance_records)
          registry['last_updated'] = '2026-08-26'
          provenance['last_reviewed'] = '2026-08-26'

          if registry.get('policy') != policy_before:
              raise SystemExit('registry policy changed unexpectedly')
          if len(registry['sources']) != existing_registry_count + len(source_records):
              raise SystemExit('registry source count mismatch after append')
          if len(provenance['sources']) != existing_provenance_count + len(provenance_records):
              raise SystemExit('provenance source count mismatch after append')

          registry_path.write_text(
              yaml.safe_dump(registry, sort_keys=False, allow_unicode=True, width=120),
              encoding='utf-8',
          )
          provenance_path.write_text(
              yaml.safe_dump(provenance, sort_keys=False, allow_unicode=True, width=120),
              encoding='utf-8',
          )
          PY
      - name: Validate seeded state
        run: python tools/repo_validator.py
      - name: Commit seeded provenance and self-clean
        run: |
          rm -f .github/workflows/phase35-provenance-seed.yml .phase35-provenance-trigger
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Dokumentation/upstream-sources.yml Dokumentation/upstream-provenance.yml .github/workflows/phase35-provenance-seed.yml .phase35-provenance-trigger
          git commit -m "provenance: register Phase 3.5 motion sources"
          git push origin HEAD:hardening/phase-3-5-webdesign-motion
