name: Phase 3 license changelog follow-up

on:
  push:
    branches:
      - hardening/phase-3-open-source-readiness
    paths:
      - .github/workflows/phase3-license-changelog-followup.yml

permissions:
  contents: write

jobs:
  update-changelog:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          ref: hardening/phase-3-open-source-readiness

      - name: Replace stale licensing blocker sentence
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('CHANGELOG.md')
          text = path.read_text(encoding='utf-8')
          old = '- Root-`LICENSE` bewusst nicht allein aus der MIT-Empfehlung erzeugt: ausdrückliche Rights-Holder-/Projektlizenzentscheidung bleibt Blocker; Security Reporting bleibt bis zu einem verifizierten privaten Meldeweg blockiert, wobei GitHub Private Vulnerability Reporting als Phase-4-Schritt nach dem Visibility-Wechsel behandelt wird und ein autorisierter alternativer privater Kanal das Gate früher schließen kann;'
          new = '- autorisierten Projektlizenz-Decision-Gate geschlossen und Root-`LICENSE` mit MIT für das originäre KI-Regeln-Projektmaterial ergänzt; Drittmaterial wird dadurch nicht relicensed, `THIRD-PARTY-NOTICES.md` bleibt für redistribution-relevante Fremdanteile maßgeblich; Security Reporting bleibt bis zu einem verifizierten privaten Meldeweg als Phase-4-Release-Day-Gate blockiert;'
          if text.count(old) != 1:
              raise SystemExit(f'expected exactly one stale licensing bullet, found {text.count(old)}')
          path.write_text(text.replace(old, new), encoding='utf-8')
          PY
          git diff --check
          git diff -- CHANGELOG.md

      - name: Commit changelog update
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add CHANGELOG.md
          git diff --cached --name-only
          test "$(git diff --cached --name-only)" = "CHANGELOG.md"
          git commit -m "docs: record authorized MIT license under unreleased"
          git push origin HEAD:hardening/phase-3-open-source-readiness
