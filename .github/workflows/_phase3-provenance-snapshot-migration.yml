name: Phase 3 provenance snapshot migration

on:
  push:
    branches:
      - hardening/phase-3-open-source-readiness

permissions:
  contents: write

jobs:
  migrate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Install dependency
        run: python -m pip install --disable-pip-version-check PyYAML==6.0.2
      - name: Bind provenance to audited source snapshots
        run: |
          python - <<'PY'
          import subprocess
          from pathlib import Path
          import yaml

          expected_registry_blob = "3690a439169a134cf3bcc14473378db80bc288c1"
          actual_registry_blob = subprocess.check_output(
              ["git", "hash-object", "Dokumentation/upstream-sources.yml"], text=True
          ).strip()
          if actual_registry_blob != expected_registry_blob:
              raise SystemExit(
                  f"registry blob changed since the 65-source audit: {actual_registry_blob} != {expected_registry_blob}"
              )

          registry_path = Path("Dokumentation/upstream-sources.yml")
          provenance_path = Path("Dokumentation/upstream-provenance.yml")
          registry = yaml.safe_load(registry_path.read_text(encoding="utf-8"))
          provenance = yaml.safe_load(provenance_path.read_text(encoding="utf-8"))
          github_sources = {
              source["id"]: source
              for source in registry["sources"]
              if source.get("kind") == "github-file"
          }
          entries = provenance.get("sources") or []
          if len(github_sources) != 65 or len(entries) != 65:
              raise SystemExit(
                  f"expected 65 GitHub sources and 65 provenance records, got {len(github_sources)} and {len(entries)}"
              )

          seen = set()
          for entry in entries:
              sid = entry["source_id"]
              if sid in seen or sid not in github_sources:
                  raise SystemExit(f"unexpected/duplicate provenance source_id: {sid}")
              seen.add(sid)
              source = github_sources[sid]
              snapshot = {
                  "repository": source["repository"],
                  "source_path": source["path"],
                  "observed_ref": source["ref"],
                  "observed_blob_sha": source["observed_sha"],
              }
              existing = entry.get("source_snapshot")
              if existing is not None and existing != snapshot:
                  raise SystemExit(f"existing snapshot mismatch for {sid}")
              entry["source_snapshot"] = snapshot

          provenance_path.write_text(
              yaml.safe_dump(provenance, sort_keys=False, allow_unicode=True, width=120),
              encoding="utf-8",
          )
          print(f"bound {len(entries)} provenance records to audited source snapshots")
          PY
      - name: Commit one-time migration
        run: |
          if git diff --quiet -- Dokumentation/upstream-provenance.yml; then
            echo "No migration change required."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Dokumentation/upstream-provenance.yml
          git commit -m "hardening: bind provenance to audited source snapshots"
          git push origin "HEAD:${GITHUB_REF_NAME}"
