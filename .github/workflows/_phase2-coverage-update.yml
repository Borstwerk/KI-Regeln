name: Phase 2 temporary coverage update

on:
  push:
    branches:
      - hardening/phase-2-evals-golden-tasks

permissions:
  contents: write

jobs:
  update:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Update exactly the Phase 2 coverage targets
        run: python tools/_phase2_update_coverage.py
      - name: Verify and commit catalog-only change
        run: |
          git diff --check
          changed="$(git diff --name-only)"
          test "$changed" = "skill-catalog.yml"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add skill-catalog.yml
          git commit -m "evals: mark new coverage as partial"
          git push
