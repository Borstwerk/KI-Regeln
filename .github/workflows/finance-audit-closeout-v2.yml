name: Finance audit closeout v2

on: [push]

permissions:
  contents: write

jobs:
  closeout:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          ref: hardening/finance-anthropic-upstream
          fetch-depth: 0
      - run: python tools/_finance_audit_closeout.py
      - run: rm -f tools/_finance_audit_closeout.py .github/workflows/finance-audit-closeout.yml .github/workflows/finance-audit-closeout-v2.yml
      - run: python -m pip install --disable-pip-version-check PyYAML==6.0.2 jsonschema==4.25.1
      - run: python tools/repo_validator.py
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Close Anthropic finance audit governance"
          git push origin HEAD:hardening/finance-anthropic-upstream
