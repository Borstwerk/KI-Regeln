name: Phase 2 smoke execution bundle

on:
  push:
    branches:
      - hardening/phase-2-evals-golden-tasks

permissions:
  contents: read

jobs:
  bundle:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 8e4c613b2913f029041ebc63e60c22cdbe4d0eec
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --disable-pip-version-check PyYAML==6.0.2
      - name: Print execution-only bundle
        run: |
          test "$(git rev-parse HEAD)" = "8e4c613b2913f029041ebc63e60c22cdbe4d0eec"
          echo '=== BOOTSTRAP: AGENTS.md ==='
          cat AGENTS.md
          python - <<'PY'
          import subprocess, yaml
          from pathlib import Path
          suite = yaml.safe_load(Path('Evals/Golden-Tasks/suite.yml').read_text(encoding='utf-8'))
          for task in suite['tasks']:
              print(f'\n=== EXECUTION VIEW: {task} ===')
              subprocess.run(['python', 'tools/golden_task_execution_view.py', task, '--assert-no-evaluator-fields'], check=True)
              data = yaml.safe_load(Path(task).read_text(encoding='utf-8'))
              for fixture in data['fixtures']:
                  print(f'\n--- FIXTURE: {fixture} ---')
                  print(Path(fixture).read_text(encoding='utf-8'))
          PY
