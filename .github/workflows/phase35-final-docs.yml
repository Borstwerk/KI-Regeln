name: Phase 3.5 final docs updater

on:
  push:
    branches:
      - hardening/phase-3-5-webdesign-motion
    paths:
      - .phase35-final-docs-trigger

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          ref: hardening/phase-3-5-webdesign-motion
      - name: Update changelog and catalog docs
        run: python tools/phase35_finalize_docs.py
      - name: Validate diff and commit documentation
        run: |
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm -f tools/phase35_finalize_docs.py .phase35-final-docs-trigger
          git add CHANGELOG.md Dokumentation/Skill-Katalog.md tools/phase35_finalize_docs.py .phase35-final-docs-trigger
          git commit -m "docs: finalize Phase 3.5 change record"
          git push origin HEAD:hardening/phase-3-5-webdesign-motion
