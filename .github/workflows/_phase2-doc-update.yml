name: Phase 2 documentation update

on:
  push:
    branches:
      - hardening/phase-2-evals-golden-tasks

permissions:
  contents: write

jobs:
  update:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Patch Phase 2 docs
        run: python tools/_phase2_doc_update.py
      - name: Verify and commit docs only
        run: |
          git diff --check
          changed="$(git diff --name-only | sort)"
          expected=$(printf '%s\n' 'Dokumentation/Skill-Katalog.md' 'Evals/README.md' | sort)
          test "$changed" = "$expected"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Dokumentation/Skill-Katalog.md Evals/README.md
          git commit -m "docs: document Phase 2 eval coverage and golden tasks"
          git push
