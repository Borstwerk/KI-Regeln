name: Phase 3.5 governance sync

on:
  push:
    branches:
      - hardening/phase-3-5-webdesign-motion
    paths:
      - .phase35-governance-sync-trigger

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          ref: hardening/phase-3-5-webdesign-motion
          fetch-depth: 0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check PyYAML==6.0.2 jsonschema==4.25.1
      - name: Update catalog and source registry minimally
        run: |
          python - <<'PY'
          from pathlib import Path
          from copy import deepcopy
          from datetime import date
          import yaml

          class IndentDumper(yaml.SafeDumper):
              def increase_indent(self, flow=False, indentless=False):
                  return super().increase_indent(flow, False)

          def mapping_value(node, key_name):
              if not isinstance(node, yaml.MappingNode):
                  return None
              for key, value in node.value:
                  if isinstance(key, yaml.ScalarNode) and key.value == key_name:
                      return value
              return None

          def render_source_records(records):
              rendered = yaml.dump(
                  {'sources': records},
                  Dumper=IndentDumper,
                  sort_keys=False,
                  allow_unicode=True,
                  width=120,
                  default_flow_style=False,
              )
              header = 'sources:\n'
              if not rendered.startswith(header):
                  raise SystemExit('unexpected source serialization')
              body = rendered[len(header):]
              if not body.startswith('  - '):
                  raise SystemExit('unexpected source record indentation')
              return body[2:].rstrip('\n')

          catalog_path = Path('skill-catalog.yml')
          catalog_text = catalog_path.read_text(encoding='utf-8')
          catalog = yaml.safe_load(catalog_text)
          if not isinstance(catalog, dict) or not isinstance(catalog.get('skills'), list):
              raise SystemExit('invalid skill catalog structure')

          new_skills = [
              {
                  'id': 'motion-design',
                  'area': 'Webentwicklung',
                  'path': 'Webentwicklung/Skills/motion-design/SKILL.md',
                  'maturity': 'experimental',
                  'eval_coverage': 'partial',
                  'purpose': 'Zweck, Intensität und Verhalten von Web-Motion als Motion-Contract definieren.',
                  'related': ['frontend-design', 'design-system', 'motion-implementation', 'motion-review'],
              },
              {
                  'id': 'motion-implementation',
                  'area': 'Webentwicklung',
                  'path': 'Webentwicklung/Skills/motion-implementation/SKILL.md',
                  'maturity': 'experimental',
                  'eval_coverage': 'partial',
                  'purpose': 'Definierte Web-Motion mit einer kontextgerechten Webplattform- oder Library-Mechanik umsetzen.',
                  'capabilities': ['repository-read-preferred', 'browser-preferred'],
                  'related': ['motion-design', 'motion-review', 'frontend-performance', 'visual-verification'],
              },
              {
                  'id': 'motion-review',
                  'area': 'Webentwicklung',
                  'path': 'Webentwicklung/Skills/motion-review/SKILL.md',
                  'maturity': 'experimental',
                  'eval_coverage': 'partial',
                  'purpose': 'Vorhandene Web-Motion unabhängig, evidenzbezogen und ohne ungefragte Reimplementation prüfen.',
                  'capabilities': ['browser-preferred'],
                  'related': ['motion-design', 'motion-implementation', 'accessibility-review', 'frontend-performance', 'visual-verification'],
              },
          ]
          ids = {s.get('id') for s in catalog['skills'] if isinstance(s, dict)}
          if any(s['id'] in ids for s in new_skills):
              raise SystemExit('one or more Phase 3.5 skills already present in catalog')
          target_index = next((i for i, s in enumerate(catalog['skills']) if isinstance(s, dict) and s.get('id') == 'visual-verification'), None)
          if target_index is None:
              raise SystemExit('visual-verification anchor not found')
          desired_catalog = deepcopy(catalog)
          desired_catalog['last_updated'] = date(2026, 8, 26)
          for offset, record in enumerate(new_skills, start=1):
              desired_catalog['skills'].insert(target_index + offset, record)

          root = yaml.compose(catalog_text)
          nodes = {k.value: v for k, v in root.value if isinstance(k, yaml.ScalarNode)}
          skills_node = nodes.get('skills')
          last_updated_node = nodes.get('last_updated')
          if not isinstance(skills_node, yaml.SequenceNode) or not isinstance(last_updated_node, yaml.ScalarNode):
              raise SystemExit('catalog parser nodes missing')
          target_node = None
          for node in skills_node.value:
              id_node = mapping_value(node, 'id')
              if isinstance(id_node, yaml.ScalarNode) and id_node.value == 'visual-verification':
                  target_node = node
                  break
          if target_node is None:
              raise SystemExit('visual-verification YAML node not found')

          catalog_lines = [
              '  - {id: motion-design, area: Webentwicklung, path: Webentwicklung/Skills/motion-design/SKILL.md, maturity: experimental, eval_coverage: partial, purpose: "Zweck, Intensität und Verhalten von Web-Motion als Motion-Contract definieren.", related: [frontend-design, design-system, motion-implementation, motion-review]}',
              '  - {id: motion-implementation, area: Webentwicklung, path: Webentwicklung/Skills/motion-implementation/SKILL.md, maturity: experimental, eval_coverage: partial, purpose: "Definierte Web-Motion mit einer kontextgerechten Webplattform- oder Library-Mechanik umsetzen.", capabilities: [repository-read-preferred, browser-preferred], related: [motion-design, motion-review, frontend-performance, visual-verification]}',
              '  - {id: motion-review, area: Webentwicklung, path: Webentwicklung/Skills/motion-review/SKILL.md, maturity: experimental, eval_coverage: partial, purpose: "Vorhandene Web-Motion unabhängig, evidenzbezogen und ohne ungefragte Reimplementation prüfen.", capabilities: [browser-preferred], related: [motion-design, motion-implementation, accessibility-review, frontend-performance, visual-verification]}',
          ]
          catalog_ops = [
              (target_node.end_mark.index, target_node.end_mark.index, '\n' + '\n'.join(catalog_lines)),
              (last_updated_node.start_mark.index, last_updated_node.end_mark.index, '2026-08-26'),
          ]
          rebuilt_catalog = catalog_text
          for start, end, replacement in sorted(catalog_ops, reverse=True):
              rebuilt_catalog = rebuilt_catalog[:start] + replacement + rebuilt_catalog[end:]
          if yaml.safe_load(rebuilt_catalog) != desired_catalog:
              raise SystemExit('catalog minimal rewrite changed unexpected semantics')
          catalog_path.write_text(rebuilt_catalog, encoding='utf-8')

          registry_path = Path('Dokumentation/upstream-sources.yml')
          registry_text = registry_path.read_text(encoding='utf-8')
          registry = yaml.safe_load(registry_text)
          if not isinstance(registry, dict) or not isinstance(registry.get('sources'), list):
              raise SystemExit('invalid upstream registry structure')
          policy_before = deepcopy(registry.get('policy'))

          impacts = {
              'emil-kowalski-motion-craft': [
                  'Dokumentation/Webdesign-Motion-Audit-Phase-3-5.md',
                  'Webentwicklung/Webdesign/Motion-und-Mikrointeraktionen.md',
                  'Webentwicklung/Skills/motion-design/SKILL.md',
                  'Webentwicklung/Skills/motion-review/SKILL.md',
              ],
              'mblode-ui-animation': [
                  'Dokumentation/Webdesign-Motion-Audit-Phase-3-5.md',
                  'Webentwicklung/Webdesign/Motion-und-Mikrointeraktionen.md',
                  'Webentwicklung/Skills/motion-design/SKILL.md',
                  'Webentwicklung/Skills/motion-review/SKILL.md',
              ],
              'taste-design-parameters': [
                  'Dokumentation/Webdesign-Motion-Audit-Phase-3-5.md',
                  'Webentwicklung/Webdesign/Motion-und-Mikrointeraktionen.md',
                  'Webentwicklung/Skills/motion-design/SKILL.md',
              ],
          }
          existing_ids = {s.get('id') for s in registry['sources'] if isinstance(s, dict)}
          if not set(impacts).issubset(existing_ids):
              raise SystemExit('methodical Phase 3.5 source missing from registry')

          technical_sources = [
              {
                  'id': 'mdn-prefers-reduced-motion', 'area': 'Webentwicklung', 'kind': 'web-page',
                  'url': 'https://developer.mozilla.org/en-US/docs/Web/CSS/Reference/At-rules/%40media/prefers-reduced-motion',
                  'monitor_mode': 'semantic-review', 'cadence': 'quarterly', 'last_checked': '2026-08-26',
                  'local_impact': [
                      'Webentwicklung/Webdesign/Motion-und-Mikrointeraktionen.md',
                      'Webentwicklung/Skills/motion-design/SKILL.md',
                      'Webentwicklung/Skills/motion-implementation/SKILL.md',
                      'Webentwicklung/Skills/motion-review/SKILL.md',
                  ],
              },
              {
                  'id': 'mdn-web-animations-api', 'area': 'Webentwicklung', 'kind': 'web-page',
                  'url': 'https://developer.mozilla.org/en-US/docs/Web/API/Web_Animations_API',
                  'monitor_mode': 'semantic-review', 'cadence': 'quarterly', 'last_checked': '2026-08-26',
                  'local_impact': ['Webentwicklung/Webdesign/Motion-und-Mikrointeraktionen.md', 'Webentwicklung/Skills/motion-implementation/SKILL.md'],
              },
              {
                  'id': 'mdn-starting-style', 'area': 'Webentwicklung', 'kind': 'web-page',
                  'url': 'https://developer.mozilla.org/en-US/docs/Web/CSS/Reference/At-rules/%40starting-style',
                  'monitor_mode': 'semantic-review', 'cadence': 'quarterly', 'last_checked': '2026-08-26',
                  'local_impact': ['Webentwicklung/Webdesign/Motion-und-Mikrointeraktionen.md', 'Webentwicklung/Skills/motion-implementation/SKILL.md'],
              },
              {
                  'id': 'mdn-view-transition-api', 'area': 'Webentwicklung', 'kind': 'web-page',
                  'url': 'https://developer.mozilla.org/en-US/docs/Web/API/View_Transition_API',
                  'monitor_mode': 'semantic-review', 'cadence': 'quarterly', 'last_checked': '2026-08-26',
                  'local_impact': ['Webentwicklung/Webdesign/Motion-und-Mikrointeraktionen.md', 'Webentwicklung/Skills/motion-implementation/SKILL.md'],
              },
              {
                  'id': 'mdn-scroll-driven-animations', 'area': 'Webentwicklung', 'kind': 'web-page',
                  'url': 'https://developer.mozilla.org/en-US/docs/Web/CSS/Guides/Scroll-driven_animations',
                  'monitor_mode': 'semantic-review', 'cadence': 'quarterly', 'last_checked': '2026-08-26',
                  'local_impact': ['Webentwicklung/Webdesign/Motion-und-Mikrointeraktionen.md', 'Webentwicklung/Skills/motion-implementation/SKILL.md'],
              },
              {
                  'id': 'motion-layout-animations-docs', 'area': 'Webentwicklung', 'kind': 'web-page',
                  'url': 'https://motion.dev/docs/react-layout-animations',
                  'monitor_mode': 'semantic-review', 'cadence': 'quarterly', 'last_checked': '2026-08-26',
                  'local_impact': ['Webentwicklung/Webdesign/Motion-und-Mikrointeraktionen.md', 'Webentwicklung/Skills/motion-implementation/SKILL.md'],
              },
              {
                  'id': 'gsap-timeline-docs', 'area': 'Webentwicklung', 'kind': 'web-page',
                  'url': 'https://gsap.com/docs/v3/GSAP/Timeline/',
                  'monitor_mode': 'semantic-review', 'cadence': 'quarterly', 'last_checked': '2026-08-26',
                  'local_impact': ['Webentwicklung/Webdesign/Motion-und-Mikrointeraktionen.md', 'Webentwicklung/Skills/motion-implementation/SKILL.md'],
              },
              {
                  'id': 'gsap-scrolltrigger-docs', 'area': 'Webentwicklung', 'kind': 'web-page',
                  'url': 'https://gsap.com/docs/v3/Plugins/ScrollTrigger/',
                  'monitor_mode': 'semantic-review', 'cadence': 'quarterly', 'last_checked': '2026-08-26',
                  'local_impact': ['Webentwicklung/Webdesign/Motion-und-Mikrointeraktionen.md', 'Webentwicklung/Skills/motion-implementation/SKILL.md'],
              },
          ]
          collisions = {s['id'] for s in technical_sources} & existing_ids
          if collisions:
              raise SystemExit(f'technical source IDs already exist: {sorted(collisions)}')

          desired_registry = deepcopy(registry)
          updated_records = {}
          for record in desired_registry['sources']:
              if isinstance(record, dict) and record.get('id') in impacts:
                  record['local_impact'] = impacts[record['id']]
                  updated_records[record['id']] = deepcopy(record)
          desired_registry['sources'].extend(technical_sources)
          if desired_registry.get('policy') != policy_before:
              raise SystemExit('policy changed in desired registry')

          registry_root = yaml.compose(registry_text)
          registry_nodes = {k.value: v for k, v in registry_root.value if isinstance(k, yaml.ScalarNode)}
          sources_node = registry_nodes.get('sources')
          if not isinstance(sources_node, yaml.SequenceNode) or not sources_node.value:
              raise SystemExit('registry sources YAML node missing')

          source_nodes = {}
          ordered_ids = []
          for node in sources_node.value:
              id_node = mapping_value(node, 'id')
              if isinstance(id_node, yaml.ScalarNode):
                  source_nodes[id_node.value] = node
                  ordered_ids.append(id_node.value)
          if ordered_ids[-3:] != ['emil-kowalski-motion-craft', 'mblode-ui-animation', 'taste-design-parameters']:
              raise SystemExit(f'unexpected Phase 3.5 source tail: {ordered_ids[-3:]}')

          ops = []
          for source_id in ['emil-kowalski-motion-craft', 'mblode-ui-animation']:
              node = source_nodes[source_id]
              ops.append((node.start_mark.index, node.end_mark.index, render_source_records([updated_records[source_id]])))

          tail_node = source_nodes['taste-design-parameters']
          tail_records = [updated_records['taste-design-parameters'], *technical_sources]
          ops.append((tail_node.start_mark.index, tail_node.end_mark.index, render_source_records(tail_records)))

          rebuilt_registry = registry_text
          for start, end, replacement in sorted(ops, reverse=True):
              rebuilt_registry = rebuilt_registry[:start] + replacement + rebuilt_registry[end:]
          parsed_rebuilt = yaml.safe_load(rebuilt_registry)
          if parsed_rebuilt != desired_registry:
              raise SystemExit('registry minimal rewrite changed unexpected semantics')
          if parsed_rebuilt.get('policy') != policy_before:
              raise SystemExit('policy changed during registry rewrite')
          if len(parsed_rebuilt['sources']) != len(desired_registry['sources']):
              raise SystemExit('source count changed during registry rewrite')
          registry_path.write_text(rebuilt_registry, encoding='utf-8')
          PY
      - name: Validate synchronized state
        run: |
          python tools/repo_validator.py
          python tools/eval_coverage_audit.py --summary
          git diff --check
      - name: Commit synchronized governance and self-clean
        run: |
          rm -f .github/workflows/phase35-governance-sync.yml .phase35-governance-sync-trigger
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add skill-catalog.yml Dokumentation/upstream-sources.yml .github/workflows/phase35-governance-sync.yml .phase35-governance-sync-trigger
          git commit -m "chore: synchronize Phase 3.5 catalog and sources"
          git push origin HEAD:hardening/phase-3-5-webdesign-motion
          git push origin --delete hardening/phase-3-5-webdesign-motion-content-stage || true
