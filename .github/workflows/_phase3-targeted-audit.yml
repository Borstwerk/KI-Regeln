name: Phase 3 targeted audit

on:
  push:
    branches:
      - hardening/phase-3-open-source-readiness

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout audited permanent state with full history
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: 85fd5f28e4a3e2ab388896c0c9231e4189521e06
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Install dependency
        run: python -m pip install --disable-pip-version-check PyYAML==6.0.2
      - name: Scan current tree and GitHub provenance
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python tools/open_source_readiness_audit.py --github --output "$RUNNER_TEMP/phase3-github.json"
      - name: Scan reachable history
        run: python tools/history_exposure_scan.py "$RUNNER_TEMP/phase3-history.json"
      - name: Print sanitized findings
        env:
          GH_REPORT: ${{ runner.temp }}/phase3-github.json
          HISTORY_REPORT: ${{ runner.temp }}/phase3-history.json
        run: |
          python - <<'PY'
          import json, os
          gh=json.load(open(os.environ['GH_REPORT'], encoding='utf-8'))
          hist=json.load(open(os.environ['HISTORY_REPORT'], encoding='utf-8'))
          print('=== INVENTORY ===')
          print(json.dumps(gh['inventory'], ensure_ascii=False, sort_keys=True))
          print('=== QUELLEN CROSSCHECK ===')
          print(json.dumps(gh['quellen_registry_crosscheck'], ensure_ascii=False, sort_keys=True))
          print('=== CURRENT TREE ===')
          print(json.dumps(gh['current_tree'], ensure_ascii=False, sort_keys=True))
          print('=== HISTORY ===')
          print(json.dumps(hist, ensure_ascii=False, sort_keys=True))
          print('=== GITHUB PROVENANCE ===')
          for record in gh['github_provenance_audit']['records']:
              print(json.dumps(record, ensure_ascii=False, sort_keys=True, separators=(',', ':')))
          PY
