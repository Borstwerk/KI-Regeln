name: Phase 2 changelog update

on:
  push:
    branches:
      - hardening/phase-2-evals-golden-tasks

permissions:
  contents: write

jobs:
  update:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Patch Unreleased changelog
        run: python tools/_phase2_changelog_update.py
      - name: Verify and commit changelog only
        run: |
          git diff --check
          test "$(git diff --name-only)" = "CHANGELOG.md"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add CHANGELOG.md
          git commit -m "docs: document Hardening Phase 2 under Unreleased"
          git push
