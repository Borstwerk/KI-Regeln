name: Phase 3.5 renderer prefix fix

on:
  push:
    branches:
      - hardening/phase-3-5-webdesign-motion
    paths:
      - .phase35-renderer-prefix-fix-trigger

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          ref: hardening/phase-3-5-webdesign-motion
      - name: Patch only renderer prefix handling
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('.github/workflows/phase35-governance-sync.yml')
          text = path.read_text(encoding='utf-8')
          old = "return body[2:].rstrip('\\n')"
          new = "return body[4:].rstrip('\\n')"
          if text.count(old) != 1:
              raise SystemExit(f'expected exactly one renderer prefix expression, found {text.count(old)}')
          text = text.replace(old, new)
          path.write_text(text, encoding='utf-8')
          PY
          printf 'phase-3-5-governance-sync-3\n' > .phase35-governance-sync-trigger
      - name: Commit patch and self-clean
        run: |
          rm -f .github/workflows/phase35-renderer-prefix-fix.yml .phase35-renderer-prefix-fix-trigger
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/workflows/phase35-governance-sync.yml .phase35-governance-sync-trigger .github/workflows/phase35-renderer-prefix-fix.yml .phase35-renderer-prefix-fix-trigger
          git commit -m "fix: correct governance renderer record prefix"
          git push origin HEAD:hardening/phase-3-5-webdesign-motion
