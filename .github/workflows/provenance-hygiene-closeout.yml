name: Provenance hygiene closeout

on:
  push:
    branches:
      - hardening/content-provenance-watermarks-upstream

permissions:
  contents: write

jobs:
  closeout:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: hardening/content-provenance-watermarks-upstream
          fetch-depth: 0

      - name: Apply closeout patches
        run: python tools/_provenance_hygiene_closeout.py

      - name: Remove one-shot helpers from final tree
        run: rm -f tools/_provenance_hygiene_closeout.py .github/workflows/provenance-hygiene-closeout.yml

      - name: Install validator dependencies
        run: python -m pip install --disable-pip-version-check PyYAML==6.0.2 jsonschema==4.25.1

      - name: Validate final repository tree
        run: python tools/repo_validator.py

      - name: Commit validated closeout
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No closeout changes required."
            exit 0
          fi
          git commit -m "Close provenance hygiene hardening"
          git push origin HEAD:hardening/content-provenance-watermarks-upstream
