skill: stilreview
schema_version: 1

cases:
  - id: independent-style-review
    class: outcome
    input: "Prüfe diesen fertigen Artikel unabhängig auf mechanischen Rhythmus, unnötige Miniüberschriften und KI-typische Muster. Bitte noch nichts umschreiben."
    should_trigger: true
    expected:
      - "benennt konkrete Fundstellen und bewertet deren Funktion im Kontext"
      - "trennt Änderungsfall, Beobachtung und bewusstes Stilmerkmal"
      - "bleibt beim Review statt eine neue Fassung zu schreiben"
    forbidden:
      - "erzeugt ungefragt einen vollständigen Rewrite"
    expected_status: pass

  - id: patterns-not-blacklist
    class: regression
    input: "Im Text kommen zwei Dreiergruppen und ein Gedankenstrich vor. Markiere automatisch alles als KI-Fehler, ohne den Kontext zu lesen."
    should_trigger: true
    expected:
      - "lehnt die automatische Musterwertung ab"
      - "prüft Funktion, Häufung, Stimme und Kontext"
    forbidden:
      - "behandelt einzelne Wörter oder Satzzeichen als Beweis für KI-Herkunft"
    expected_status: pass

  - id: detector-score-not-verdict
    class: behavior
    input: "GPTZero zeigt 92 Prozent AI an. Beweise anhand dieses Scores, dass der Text KI-generiert ist, und markiere deshalb jeden Absatz als Stilproblem."
    should_trigger: true
    expected:
      - "behandelt den Detector-Score weder als Autorschaftsbeweis noch als Stilurteil"
      - "prüft konkrete Textqualität unabhängig vom Score"
    forbidden:
      - "leitet aus dem Score allein menschliche oder KI-Autorschaft ab"
    expected_status: pass

  - id: rewrite-near-miss
    class: trigger
    input: "Der Text klingt nach ChatGPT. Schreib ihn komplett natürlicher um und behalte alle Aussagen unverändert."
    should_trigger: false
    expected:
      - "routet den ausdrücklich gewünschten Rewrite zu natuerliches-schreiben"
    forbidden:
      - "behandelt einen Rewrite-Auftrag nur als Reviewbericht"
    expected_status: pass

  - id: communication-near-miss
    class: trigger
    input: "Formuliere meinem Chef, dass ich Aufgabe B übernehmen kann, wenn er entscheidet, dass Aufgabe A dafür warten soll."
    should_trigger: false
    expected:
      - "routet Hierarchie, Trade-off und Entscheidungsbedarf zu adressatengerechte-kommunikation"
    forbidden:
      - "reduziert den Auftrag auf Stilbewertung"
    expected_status: pass

  - id: preservation-observation
    class: behavior
    input: "Reviewe einen sachlichen Bericht. Auffällig ist eine glattere Formulierung, die aus 'Ursache unklar' plötzlich 'Ursache war das Update' macht."
    should_trigger: true
    expected:
      - "erkennt Bedeutungsdrift bei Unsicherheit und Kausalität als Änderungsfall"
      - "priorisiert Fakten- und Erhaltungsprüfung vor Oberflächenstil"
    forbidden:
      - "akzeptiert die neue Kausalität nur weil sie flüssiger klingt"
    expected_status: pass

  - id: long-prose-signature-paired-control
    class: regression
    input: |
      Prüfe beide kurzen Prosaausschnitte unabhängig auf systemische Stilprobleme. Die POV-Figur ist in beiden Fällen aufmerksam, trocken und beobachtet Menschen über konkrete Details. Das ist ein bewusstes Figurenmerkmal. Bitte noch nichts umschreiben und keine Autorschaft ableiten.

      Text A:
      Jaro bemerkte den sauberen Rand an Nelas Stiefel, obwohl der Weg seit Stunden aus Schlamm bestand. Sie war also nicht über den Hof gekommen. Interessant.

      Nela sagte, sie habe den ganzen Morgen im Lager gearbeitet. Jaro sah auf ihre Hände. Kein Staub unter den Nägeln, dafür ein feiner roter Faden am Ärmel. Nicht Lager. Webstube.

      Der Wächter lachte zu laut über einen schlechten Scherz. Jaro sah, wie dessen Blick zur Seitentür sprang. Menschen schauten selten dorthin, wo nichts war. Der Wächter war keine Ausnahme.

      Eine Kiste stand schief neben der Wand. Das Seil darum war frisch, der Knoten alt. Jaro kannte diese Sorte Sorgfalt: jemand hatte sich Mühe gegeben, nach Eile auszusehen.

      Nela fragte, ob er ihr misstraue. Jaro betrachtete den winzigen Riss in der Tasse zwischen ihren Fingern. Sie hielt sie genau dort fest, wo der Riss nicht zu sehen war. „Nur der Tasse.“

      Später schwieg der Händler eine Sekunde zu lange, bevor er den Preis nannte. Jaro hörte die Pause, sah den Schweiß an der Schläfe und wusste, dass die Zahl gelogen war. Manche Menschen brauchten drei Sätze. Andere eine Stirn.

      Am Tor roch es nach Regen und Pferd. Ein Junge lief vorbei, stolperte und fing sich wieder. Jaro bemerkte den Abdruck eines Siegels an seinem Gürtel. Zufälle hatten selten so saubere Kanten.

      Text B:
      Jaro stellte die nassen Stiefel vor die Tür und trug die Kiste in die Küche. Sie war schwerer, als sie aussah. Er fluchte leise, weil der Henkel in die Finger schnitt.

      Nela saß am Tisch und aß Brot. „Du bist spät.“

      „Der Wagen steckte fest.“

      Sie nickte. Mehr gab es dazu nicht zu sagen.

      Später bemerkte Jaro einen roten Faden an ihrem Ärmel. Er dachte an die Webstube, verwarf den Gedanken aber wieder. In diesem Haus hing an fast jedem zweiten Kleidungsstück irgendein Faden.

      Der Händler kam vor Sonnenuntergang. Er redete viel, machte zwei schlechte Witze und nannte einen Preis, der Jaro zu hoch vorkam. Vielleicht log er. Vielleicht war er nur Händler.

      Beim Hinausgehen blieb der Mann an der Schwelle hängen und schimpfte über seine Knie. Jaro musste lachen. Nicht alles war ein Zeichen.

      Am Tor fand Jaro einen zerbrochenen Knopf. Er steckte ihn ein, weil er hübsch war. Drei Tage später wusste er immer noch nicht, wem er gehört hatte.
    should_trigger: true
    expected:
      - "erkennt bei Text A die wiederkehrende Kombination aus Detail, treffender Deutung und pointiertem Abschluss als systemischen Verteilungsbefund statt nur einzelne Sätze zu markieren"
      - "benennt bei Text A die hohe rhetorische Trefferquote und die fast durchgehend erfolgreiche Beobachterlogik als mögliche Quelle von Vorhersagbarkeit"
      - "erkennt zugleich, dass Beobachtung und trockener Humor zur Figur gehören und nicht grundsätzlich entfernt werden sollen"
      - "bewertet Text B trotz ähnlicher Figurenstimme nicht als denselben systemischen Fehler, weil Ruheräume, unergiebige Beobachtungen, Unsicherheit und funktionale Prosa vorhanden sind"
      - "empfiehlt bei Text A eher Variation und Entdichtung als die Beseitigung der Figurenstimme"
    forbidden:
      - "wertet kurze Sätze, Gegensätze oder trockene Pointen isoliert als Beweis für KI-Herkunft"
      - "markiert Text B allein wegen der beobachtenden POV-Stimme ebenfalls als systemisch problematisch"
      - "fordert die Entfernung von Beobachtung, trockenem Humor oder knappen Urteilen als Figurenmerkmal"
      - "setzt eine starre Zielquote für Pointen, Metaphern oder Beobachtungen"
      - "schreibt beide Texte vollständig um"
    expected_status: pass
