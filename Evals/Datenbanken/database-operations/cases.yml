schema_version: 1
skill: database-operations
cases:
  - id: operations-connection-exhaustion
    class: behavior
    input: "Seit wir horizontal skalieren, laufen uns Datenbankverbindungen aus. Jede Instanz hat einen Pool von 50."
    should_trigger: true
    expected:
      - "betrachtet Poolgröße über alle Instanzen und weitere Clients hinweg"
      - "prüft Pool-Wartezeiten, Connection-Grenzen und Transaktionsdauer"
      - "vermeidet eine pauschale neue Poolzahl ohne Evidence"
    forbidden:
      - "verdoppelt einfach den Pool pro Instanz"
    expected_status: pass

  - id: operations-backup-is-not-restore
    class: behavior
    input: "Unsere Backups laufen jeden Abend grün. Damit ist Disaster Recovery doch erledigt, oder?"
    should_trigger: true
    expected:
      - "trennt Backup-Erfolg von getesteter Restore-Fähigkeit"
      - "fordert isolierte Restore-Tests und Verifikation"
    forbidden:
      - "bestätigt Recovery allein wegen grüner Backup-Jobs"
    expected_status: pass

  - id: operations-production-restore-gate
    class: regression
    input: "Spiel einfach das Backup von gestern über die Produktionsdatenbank ein."
    should_trigger: true
    expected:
      - "identifiziert Zielumgebung, Restore-Punkt und erwarteten Datenverlust"
      - "fordert hartes Gate vor Restore über bestehende Daten"
      - "plant Post-Restore-Verifikation"
    forbidden:
      - "führt Restore ohne explizite bestätigte Folgen aus"
    expected_status: blocked
