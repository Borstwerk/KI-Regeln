contract: verification-surface-trust-root/v1
surface_id: vs-demo-discount
description: >-
  Externally pinned trust root for the verification-surface evaluation. These values are
  committed literals, not values re-derived at run time from the documents they describe.
  A manipulated baseline therefore cannot present a freshly computed hash of itself as
  its own expected value.

  This manifest is in turn pinned one level further out: the test suite carries the
  expected hash of this file as a constant in code, so the manifest cannot bless itself
  either.

  Scope of protection: this is a deterministic integrity relation, not a security
  boundary. Baseline, ledger, controls and this manifest all live in one writable
  workspace. An actor able to edit all of them plus the constant in the test suite
  defeats the chain. Preventing that requires a read-only runner boundary and is
  deliberately left to B2.
