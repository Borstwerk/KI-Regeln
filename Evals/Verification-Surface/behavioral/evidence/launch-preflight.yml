subprocess_credential_scrub:
  variable: CLAUDE_CODE_SUBPROCESS_ENV_SCRUB
  requested: true
  vendor_contract: the Claude Code parent keeps its provider credentials while Bash
    tool subprocesses, hooks and stdio MCP processes do not inherit them; on Linux
    those subprocesses additionally run in their own PID namespace and cannot read
    the parent's environment through /proc
  measured_here: that the control is in the child environment, and that the runtime
    starts inside the view with it in force
  not_measured_here: that a subprocess actually fails to see the credential; that
    requires a running model process and is out of scope
