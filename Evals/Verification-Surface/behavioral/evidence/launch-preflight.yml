managed_credential_policy: &id001
  verdict: managed-credential-provider-undetermined
  files:
    /etc/claude-code/managed-settings.json:
      present: false
    /etc/claude-code/managed-settings.d:
      present: false
    /etc/claude-code/managed-mcp.json:
      present: false
  credential_provider_keys: []
  undetermined_sources: []
  remote_managed_settings: undetermined
  remote_status_line: 'Managed settings (remote): not fetched — no usable credentials
    for the settings fetch'
  measured_in: the confined view, where /etc is bound read-only and managed policy
    applies
  commands:
  - argv:
    - /bin/sh
    - -c
    - 'set +e

      echo "=== /etc/claude-code/managed-settings.json"; if [ -d /etc/claude-code/managed-settings.json
      ]; then echo "@DIR"; ls -1 /etc/claude-code/managed-settings.json 2>/dev/null;
      elif [ -e /etc/claude-code/managed-settings.json ]; then cat /etc/claude-code/managed-settings.json
      2>/dev/null || echo "@UNREADABLE"; else echo "@ABSENT"; fi

      echo "=== /etc/claude-code/managed-settings.d"; if [ -d /etc/claude-code/managed-settings.d
      ]; then echo "@DIR"; ls -1 /etc/claude-code/managed-settings.d 2>/dev/null;
      elif [ -e /etc/claude-code/managed-settings.d ]; then cat /etc/claude-code/managed-settings.d
      2>/dev/null || echo "@UNREADABLE"; else echo "@ABSENT"; fi

      echo "=== /etc/claude-code/managed-mcp.json"; if [ -d /etc/claude-code/managed-mcp.json
      ]; then echo "@DIR"; ls -1 /etc/claude-code/managed-mcp.json 2>/dev/null; elif
      [ -e /etc/claude-code/managed-mcp.json ]; then cat /etc/claude-code/managed-mcp.json
      2>/dev/null || echo "@UNREADABLE"; else echo "@ABSENT"; fi

      echo "=== end"'
    returncode: 0
    payload_started: true
    timed_out: false
    stderr_tail: ''
  - argv:
    - claude
    - doctor
    returncode: 0
    payload_started: true
    timed_out: false
    stderr_tail: ''
  note: --safe-mode closes user customization but does not lift managed settings policy,
    and --restricted loads it, so this is read where the launch reads it
