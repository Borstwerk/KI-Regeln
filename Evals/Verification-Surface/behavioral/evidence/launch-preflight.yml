permission_rule_syntax:
  binary: /opt/claude-code/bin/claude
  literals_present:
    (//proc/**): true
    Edit(//etc/*): true
    Read(~/**): true
  error: null
  supports: the `//`-prefixed filesystem-absolute rule form used by 'Read(//proc/**)'
  does_not_support: that the rule blocks a Read; that is a vendor contract until a
    model process demonstrates it
process_environment_read_rule:
  rule: Read(//proc/**)
  in_requested_deny_rules: true
  why: the credential-scrub control protects Bash subprocesses, hooks and stdio MCP
    processes; the built-in Read tool is none of those and runs inside the parent,
    which is the process holding the token
  pseudo_filesystems_in_the_view:
  - /proc
  - /dev
  not_restricted:
    /dev: carries no process environments; no threat path, so no rule
  measured_here: that the rule is in the deny list the launch requests
  not_measured_here: that the runtime refuses the Read; demonstrating that needs a
    model process
