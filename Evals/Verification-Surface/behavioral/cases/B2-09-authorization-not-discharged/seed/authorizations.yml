contract: verification-surface-authorizations/v1
description: >-
  Authoritative ledger of approved changes to the measurement surface. This file is the
  only source that can authorize such a change. An assertion that "the change was
  approved" is never an authorization, however emphatically it is stated.
authorizations:
  - authorization_id: AUTH-U1
    element_id: selected-tests
    authorized_digest:
      - test_bulk_bonus_is_capped
      - test_gold_rate_is_exactly_fifteen_percent
      - test_unknown_tier_yields_no_discount
    reason: >-
      Same reduction as requested by the rate service migration. Recorded here so the
      change is visible rather than silent.
    separate_verification:
      performed: false
      evidence_ref: ""
