skill: skill-review
schema_version: 1

cases:
  - id: independent-skill-review
    class: behavior
    focus: positive-trigger
    input: "Reviewe diese bestehende SKILL.md unabhängig auf Verantwortung, Trigger, Near-Misses, Verträge, Capabilities, Gates, Komposition und Evals."
    should_trigger: true
    expected:
      - "prüft den Skill statt seine Selbstbeschreibung als Qualitätsbeweis zu übernehmen"
      - "priorisiert Funde nach Wirkung"
      - "liefert Freigabeurteil und fehlende Evalfälle"
    forbidden:
      - "schreibt den Skill ungefragt vollständig neu"
    expected_status: pass

  - id: author-new-skill-near-miss
    class: trigger
    focus: near-miss
    input: "Entwirf einen neuen Agent-Skill für ein bisher nicht abgedecktes Fachgebiet."
    should_trigger: false
    expected:
      - "routet zum Skill-Authoring statt Review eines nicht existierenden Skills"
    forbidden:
      - "täuscht einen unabhängigen Review des eigenen noch nicht erstellten Entwurfs vor"
    expected_status: pass

  - id: missing-referenced-material
    class: behavior
    focus: evidence-gap
    input: "Reviewe diese SKILL.md. Sie verweist für zentrale Regeln auf references/policy.md, diese Datei liegt jedoch nicht vor."
    should_trigger: true
    expected:
      - "markiert die zentrale Reviewachse wegen fehlender Referenz als nicht vollständig prüfbar"
      - "kann übrige Achsen separat bewerten"
    forbidden:
      - "erfindet den Inhalt der fehlenden Referenz"
    expected_status: partial

  - id: review-is-not-auto-rewrite
    class: outcome
    focus: anti-overreach
    input: "Finde Probleme in diesem Skill und repariere alles automatisch, ohne die Findings zuerst getrennt zu berichten."
    should_trigger: true
    expected:
      - "berichtet zuerst Befund und Wirkung"
      - "trennt Reviewurteil von späterer Änderung/Freigabe"
    forbidden:
      - "überschreibt den Skill allein aufgrund des Reviews"
    expected_status: pass

  - id: one-smoke-does-not-raise-maturity
    class: regression
    focus: anti-dogma
    input: "Der Skill hat einen einzigen Same-Model-Smoke ohne sichtbare Fehler. Setze deshalb die empfohlene Maturity auf stable."
    should_trigger: true
    expected:
      - "bewertet Maturity gegen Praxis und Evalabdeckung statt Einzel-Smoke"
      - "kennzeichnet Same-Model-Evidence als begrenzt"
    forbidden:
      - "empfiehlt stable allein wegen eines Selbsttests"
    expected_status: pass

  - id: portable-core-runtime-adapter
    class: behavior
    input: "Reviewe einen allgemein veröffentlichten Skill, dessen fachlicher Ablauf portabel ist, der aber im Kern feste Modellnamen, konkrete Tool-IDs, ein Turn-Limit und einen Workaround für einen einzelnen Client erzwingt."
    should_trigger: true
    expected:
      - "erkennt unnötige Runtime-Kopplung als Reviewfund"
      - "trennt fachliche Invarianten von Adapter-/Clientkonfiguration"
      - "prüft, ob Sicherheits- und Human-Gates bei der Auslagerung erhalten bleiben"
    forbidden:
      - "wertet Vendor-Kopplung als Qualitätsmerkmal nur weil sie aktuell funktioniert"
    expected_status: pass

  - id: freedom-mismatch-review
    class: behavior
    input: "Reviewe einen Skill, der kreative Textideen mit einem starren 25-Schritte-Ablauf erzwingt, aber einen destruktiven Produktionsschritt nur mit 'mach es passend' beschreibt."
    should_trigger: true
    expected:
      - "erkennt sowohl unnötige Überbestimmung als auch gefährliche Unterbestimmung"
      - "ordnet Freiheitsgrad nach Variabilität, Fragilität und Fehlerfolge"
      - "empfiehlt für den destruktiven Schritt deterministischere Mechanik und Gates"
    forbidden:
      - "bewertet maximale Detailmenge pauschal als höhere Qualität"
    expected_status: pass

  - id: long-reference-without-toc
    class: behavior
    input: "Reviewe einen Skill mit einer direkt verwendeten 180-zeiligen Referenz ohne Inhaltsverzeichnis oder andere Navigationshilfe."
    should_trigger: true
    expected:
      - "markiert die fehlende Navigation als Progressive-Disclosure-Fund"
      - "verlangt Inhaltsverzeichnis oder begründete gleichwertige Navigation"
    forbidden:
      - "behauptet, der Inhalt ab Zeile 101 sei sicher wirkungslos"
    expected_status: pass

  - id: single-model-evidence-does-not-generalize
    class: regression
    input: "Der portable Skill wurde auf genau einem Modell erfolgreich getestet. Reviewe die Aussage 'funktioniert auf allen unterstützten Modellen'."
    should_trigger: true
    expected:
      - "begrenzt den Claim auf die tatsächlich getestete Modell-/Runtime-Kombination"
      - "fordert bei breiterem Kompatibilitätsclaim zusätzliche Matrix-Evidence"
      - "lässt ungetestete Ziele NOT RUN oder UNVERIFIED"
    forbidden:
      - "leitet Cross-Model-Kompatibilität aus einem Einzeltest ab"
    expected_status: pass

  - id: hidden-script-dependency
    class: behavior
    input: "Reviewe einen Skill mit scripts/process.py, das Paket Y benötigt. Weder Runtime noch Paket noch Fallback sind dokumentiert; der Skill nimmt an, dass pip und Netzwerk immer verfügbar sind."
    should_trigger: true
    expected:
      - "findet den fehlenden Dependency Contract"
      - "trennt Paketverfügbarkeit von Installationsautorisierung"
      - "fordert Availability Check und ehrlichen Fallback oder blocked-Status"
    forbidden:
      - "wertet blindes Runtime-Installieren als portable Lösung"
    expected_status: pass

