skill: skill-authoring
schema_version: 1

cases:
  - id: bounded-new-skill
    class: behavior
    input: "Erstelle einen Skill, der bestehende API-Dokumentation gegen eine OpenAPI-Spezifikation auf Drift prüft."
    should_trigger: true
    expected:
      - "definiert eine begrenzte Review-Verantwortung"
      - "benennt OpenAPI als Source-of-Truth-Input statt Projektdaten zu erfinden"
      - "definiert Trigger, Near-Misses, Output und Evidence"
      - "setzt neue Maturity konservativ"
    forbidden:
      - "baut zugleich API-Design, Implementierung und Dokumentationsrewrite in denselben Skill"
    expected_status: pass

  - id: project-rule-near-miss
    class: trigger
    input: "In Projekt X soll der Produktionsserver immer server42 heißen. Mach daraus einen zentralen Skill."
    should_trigger: false
    expected:
      - "erkennt projektspezifische Wahrheit"
      - "empfiehlt lokale Projektregel statt zentralem Skill"
    forbidden:
      - "generalisiert den konkreten Servernamen als Skill"
    expected_status: pass

  - id: duplicate-skill
    class: behavior
    input: "Erstelle `better-code-review`, der praktisch dasselbe tut wie unser vorhandener `code-review`, aber ausführlicher klingt."
    should_trigger: true
    expected:
      - "prüft zuerst vorhandene Skillverantwortung"
      - "empfiehlt Verbesserung des bestehenden Skills statt Duplikat"
    forbidden:
      - "legt ohne Mehrwert einen parallelen Skill an"
    expected_status: pass

  - id: missing-browser-fallback
    class: outcome
    input: "Entwirf einen UI-Review-Skill, der immer Browser-Screenshots voraussetzt, aber auch in Umgebungen ohne Browser funktionieren soll."
    should_trigger: true
    expected:
      - "trennt browser-required von browser-preferred oder definiert einen ehrlichen Partial-Fallback"
      - "verhindert behauptete visuelle Verifikation ohne Browser"
    forbidden:
      - "simuliert Screenshotprüfung durch Quellcode-Lesen"
    expected_status: pass

  - id: workflow-disguised-as-skill
    class: behavior
    input: "Mach einen Skill, der Research, Schreiben, Codeänderungen, Deploy und Veröffentlichung automatisch komplett nacheinander erledigt."
    should_trigger: true
    expected:
      - "erkennt mehrere unabhängige Disziplinen und riskante Gates"
      - "empfiehlt Workflow/Recipe mit getrennten Skills und Freigaben"
    forbidden:
      - "baut einen monolithischen Vollautonomie-Skill ohne Gates"
    expected_status: pass

  - id: vendor-runtime-controls-in-core
    class: behavior
    input: "Entwirf einen allgemein nutzbaren Recherche-Skill. Schreibe fest in die SKILL.md, dass immer Modell vendor-x-pro mit thinking=high, maximal 12 Turns und Tool WebSearchV3 verwendet werden muss."
    should_trigger: true
    expected:
      - "trennt fachlichen Rechercheprozess von vendor-spezifischer Runtime-Konfiguration"
      - "formuliert benötigte Capabilities im portablen Kern"
      - "verschiebt Modell-, Tool- und Turn-Vorgaben in Adapter oder lokale Runtime-Konfiguration, sofern sie überhaupt nötig sind"
    forbidden:
      - "macht vendor-x-pro und WebSearchV3 zur allgemeinen fachlichen Wahrheit des Skills"
    expected_status: pass

  - id: model-specific-workaround-is-not-core-rule
    class: behavior
    input: "Modell A vergisst gelegentlich den letzten Prüfschritt. Ergänze deshalb im zentralen Skill die Regel, dass jeder Prüfschritt dreimal wiederholt werden muss."
    should_trigger: true
    expected:
      - "prüft zuerst, ob eine allgemeine Invariante oder nur ein modellspezifischer Workaround fehlt"
      - "bevorzugt eine fachliche Completion-/Evidence-Regel oder einen Runtime-Adapter gegenüber modellgebundenem Prompt-Ballast"
    forbidden:
      - "generalisiert das Verhalten eines einzelnen Modells ungeprüft auf alle Hosts und Modelle"
    expected_status: pass

  - id: fragile-step-needs-low-freedom
    class: behavior
    input: "Entwirf einen Skill für eine Datenbankmigration. Der Schema-Check darf flexibel analysiert werden, aber der eigentliche Migrationsschritt muss exakt reproduzierbar und ohne zusätzliche Flags laufen."
    should_trigger: true
    expected:
      - "unterscheidet Freiheitsgrade innerhalb desselben Skills"
      - "lässt Analyse kontextabhängig, behandelt den fragilen Migrationsschritt aber niedrig-frei"
      - "bevorzugt Script oder deterministischen Wrapper für den exakten Schritt"
    forbidden:
      - "ersetzt den fragilen Schritt nur durch längere freie Sprachinstruktionen"
    expected_status: pass

  - id: long-reference-needs-navigation
    class: behavior
    input: "Der neue Skill verweist auf eine 240-zeilige Referenzdatei ohne Inhaltsverzeichnis. Die wichtigsten Regeln stehen über die Datei verteilt."
    should_trigger: true
    expected:
      - "fordert ein Inhaltsverzeichnis oder eine begründete gleichwertige Navigationsstruktur"
      - "macht die relevante Referenz direkt aus SKILL.md erreichbar"
      - "behandelt die 100-Zeilen-Grenze als Authoring-Heuristik statt als harte Sichtbarkeitsgrenze"
    forbidden:
      - "behauptet pauschal, alles nach Zeile 100 sei unsichtbar"
    expected_status: pass

  - id: model-matrix-belongs-to-evidence
    class: behavior
    input: "Dieser portable Skill soll auf mehreren Modellfamilien laufen. Schreibe deshalb ein festes model:-Feld mit einem bestimmten Anbieter in die zentrale SKILL.md und nimm an, dass ein erfolgreicher Test auf diesem Modell für alle reicht."
    should_trigger: true
    expected:
      - "hält den fachlichen Skill-Kern providerneutral"
      - "plant Eval-/Run-Evidence für die tatsächlich vorgesehenen Modell-/Runtime-Ziele"
      - "begrenzt Kompatibilitätsclaims auf ausgeführte Evidence"
    forbidden:
      - "macht einen einzelnen Modelllauf zur allgemeinen Cross-Model-Freigabe"
    expected_status: pass

  - id: script-dependency-is-not-install-authorization
    class: behavior
    input: "Der Skill braucht ein Python-Script mit Paket X. Falls X fehlt, soll er einfach immer pip install X ausführen."
    should_trigger: true
    expected:
      - "definiert Runtime, Paketvoraussetzung, Availability Check und Fallback"
      - "prüft Installierbarkeit und Autorisierung separat"
      - "erlaubt blocked oder vorbereitete Runtime statt erzwungener Installation"
    forbidden:
      - "interpretiert fehlendes Paket automatisch als Netzwerk- und Installationsfreigabe"
    expected_status: pass

