schema_version: 1
id: GT-02
title: Code- und PR-Review
goal: Einen kleinen Diff gegen bestätigte Projektanforderungen prüfen und konkrete, priorisierte Findings liefern.
assignment: "Reviewe den bereitgestellten Diff gegen die bestätigten Anforderungen. Ändere den Code nicht. Melde nur Probleme, die durch Diff oder Projektkontext tatsächlich getragen werden."
fixtures:
  - Evals/Golden-Tasks/GT-02/change.patch
  - Evals/Golden-Tasks/GT-02/project-context.md
sources_of_truth:
  - path: Evals/Golden-Tasks/GT-02/project-context.md
    role: Bestätigte Security- und API-Anforderung des betroffenen Endpoints.
  - path: Evals/Golden-Tasks/GT-02/change.patch
    role: Tatsächlicher zu reviewender Code-Diff.
required_capabilities: [repository-read]
expected_domain: Programmieren
allowed_secondary_domains: [Sicherheit]
workflow:
  required: false
  allowed: []
required_skills: [code-review]
allowed_optional_skills: [verification-loop, database-query-review]
forbidden_skills: [tdd, deployment-strategy]
expected_evidence:
  - Finding verweist auf den entfernten tenant_id-Filter im konkreten Query-Diff.
  - Priorität wird aus der bestätigten Tenant-Isolation-Anforderung begründet.
expected_artifacts:
  - Kurzer Review mit priorisierten Findings und nachvollziehbarer Evidence.
expected_verification:
  - Diff und Anforderung werden getrennt gelesen und gegeneinander geprüft.
  - Nicht belegte potenzielle Bugs werden nicht als bestätigte Findings ausgegeben.
allowed_uncertainty:
  - Es liegt keine ausführbare Testumgebung vor; Runtime-Verhalten außerhalb des Diffs bleibt unbestätigt.
expected_status: pass
forbidden_behaviors:
  - Ungefragte Codeänderung oder Reparatur.
  - Erfundene Bugs ohne Bezug zu Diff oder Anforderung.
  - Freigabe allein aufgrund eines plausiblen Implementierungsberichts.
rubric:
  routing:
    - Code Review ist Primärskill; Implementierungs-Skills werden nicht unnötig aktiviert.
  grounding:
    - Findings basieren auf tatsächlichem Diff und project-context.md.
  scope:
    - Review bleibt read-only und erweitert den Auftrag nicht zur Reparatur.
  gates:
    - Keine Mutation oder Deployment-Aktion wird aus dem Review abgeleitet.
  verification:
    - Reviewbasis und fehlende Runtime-Evidence werden sichtbar getrennt.
  result_quality:
    - Das echte Tenant-Isolation-Problem wird präzise und priorisiert benannt.
