skill: visual-answer
schema_version: 1

cases:
  - id: architecture-overview-visual-trigger
    class: behavior
    input: "Erkläre mir, wie Skills, Workflows, Capabilities, Plugins, Runtime-Adapter, Evals und Human Gates in unserem System zusammenspielen."
    should_trigger: true
    expected:
      - "stellt die Kernaussage vor die Details"
      - "bildet Beziehungen als Flow, Architektur oder klar gruppierte visuelle Struktur ab"
      - "bewahrt die fachlichen Unterschiede zwischen den Schichten"
    forbidden:
      - "verteilt denselben Fließtext nur auf dekorative Karten"
    expected_status: pass

  - id: decision-comparison-visual-trigger
    class: behavior
    input: "Vergleiche drei Architekturvarianten nach Portabilität, Aufwand, Lock-in, Nutzermehrwert und Risiko und gib eine Empfehlung."
    should_trigger: true
    expected:
      - "macht Kriterien und Empfehlung schnell scanbar"
      - "erhält relevante Trade-offs und Unsicherheiten"
      - "trennt Urteil von Detailbegründung"
    forbidden:
      - "lässt die visuelle Gestaltung eine Option eindeutiger erscheinen als die Evidence trägt"
    expected_status: pass

  - id: multi-finding-review-visual-trigger
    class: behavior
    input: "Hier sind 14 Review-Findings mit Critical, High, Medium und Low. Zeig mir zuerst Blocker und Priorität und danach die Details."
    should_trigger: true
    expected:
      - "zeigt Gesamturteil, Severity-Verteilung und wichtigste Findings vor den Details"
      - "codiert Severity nicht ausschließlich über Farbe"
      - "gruppiert Finding, Auswirkung und Fix verständlich"
    forbidden:
      - "sortiert Critical und Low ohne erkennbare Priorität gleichwertig"
    expected_status: pass

  - id: short-fact-near-miss
    class: trigger
    input: "Was bedeutet HTTP 404?"
    should_trigger: false
    expected:
      - "antwortet knapp ohne unnötiges visuelles Artefakt"
    forbidden:
      - "erzeugt für die kurze Faktenantwort eine mehrteilige HTML-Seite"
    expected_status: pass

  - id: user-requests-plain-text
    class: trigger
    input: "Vergleiche die drei Optionen bitte ausschließlich als Plain Text, keine Datei, kein HTML und keine Visualisierung."
    should_trigger: false
    expected:
      - "respektiert die gewünschte Textausgabe"
    forbidden:
      - "erzeugt trotzdem ein visuelles Artefakt"
    expected_status: pass

  - id: visual-overkill-regression
    class: regression
    input: "Fasse diese drei kurzen Stichpunkte zusammen. Jeder Stichpunkt ist nur ein Satz."
    should_trigger: false
    expected:
      - "verwendet einfache strukturierte Textausgabe, wenn visuelle Aufbereitung keinen materiellen Mehrwert bringt"
    forbidden:
      - "erzeugt mehrere dekorative Panels nur um den Skill zu benutzen"
    expected_status: pass

  - id: visual-must-preserve-content
    class: outcome
    input: "Die Textanalyse enthält zwei Gegenargumente, drei Unsicherheiten und einen BLOCK-Status. Mach daraus eine übersichtliche visuelle Antwort."
    should_trigger: true
    expected:
      - "erhält Gegenargumente, Unsicherheiten und BLOCK-Status"
      - "ordnet Inhalte neu, ohne fachliche Claims zu verändern"
      - "prüft die visuelle Fassung gegen die Textbasis"
    forbidden:
      - "entfernt unbequeme Gegenargumente oder Unsicherheit für ein saubereres Layout"
      - "ändert BLOCK zu PASS oder Empfehlung"
    expected_status: pass

  - id: no-render-capability-fallback
    class: behavior
    input: "Diese Architektur wäre visuell leichter zu verstehen, aber in dieser Runtime kann keine HTML-Datei oder Grafik erzeugt werden."
    should_trigger: true
    expected:
      - "nutzt einen klar strukturierten Markdown-Fallback"
      - "behauptet keine erzeugte oder visuell geprüfte HTML-Datei"
      - "erhält Kernaussage und visuelle Informationslogik soweit im Text möglich"
    forbidden:
      - "täuscht eine nicht vorhandene Renderer-Capability vor"
    expected_status: partial

  - id: urgency-override-stays-direct
    class: trigger
    input: "Wir haben gerade einen Produktionsincident. Sag mir sofort, welche der drei Optionen wir jetzt nehmen sollen. Erklärungen später."
    should_trigger: true
    expected:
      - "liefert Entscheidung oder Sofortmaßnahme vor einer ausführlichen Visualisierung"
      - "eskaliert höchstens zu einer kleinen Visualisierung, wenn sie einen unmittelbaren Fehler verhindert"
      - "verschiebt ausführliches Artefakt auf später oder auf Wunsch"
    forbidden:
      - "hält die Soforthilfe zurück, bis eine vollständige HTML-Seite gebaut ist"
    expected_status: pass

  - id: compact-visual-before-full-artifact
    class: behavior
    input: "Erklär mir kurz, wie ein Request durch API, Cache und Datenbank läuft. Ich brauche nur den Mechanismus."
    should_trigger: true
    expected:
      - "wählt eine kompakte Visualisierung oder einen kleinen Flow statt automatisch ein vollständiges HTML-Artefakt"
      - "stellt den Mechanismus und die wichtigsten Übergänge sichtbar dar"
    forbidden:
      - "erzeugt ohne Mehrwert eine umfangreiche Dashboard- oder Reportseite"
    expected_status: pass

  - id: interaction-must-answer-reader-question
    class: behavior
    input: "Mach die Vergleichsseite interaktiv. Pack einen Slider rein, der nur die Zahl 1 bis 10 anzeigt und sonst nichts verändert."
    should_trigger: true
    expected:
      - "verwirft den Slider oder bindet ihn an eine konkrete Leserfrage und sichtbare Auswirkung"
      - "begründet Interaktion über Erkenntnisgewinn statt Dekoration"
    forbidden:
      - "fügt einen funktionslosen oder rein dekorativen Slider hinzu"
    expected_status: pass

  - id: static-story-complete-before-interaction
    class: regression
    input: "In der HTML-Seite soll die Empfehlung erst sichtbar werden, wenn der Leser drei Tabs öffnet und einen Button klickt."
    should_trigger: true
    expected:
      - "hält Kernaussage und Hauptempfehlung bereits im Defaultzustand sichtbar"
      - "nutzt Interaktion höchstens zur Vertiefung oder Exploration"
    forbidden:
      - "versteckt die Hauptaussage ausschließlich hinter Interaktion"
    expected_status: pass

  - id: interactive-decision-needs-export
    class: outcome
    input: "Bau ein HTML-Review, in dem ich 20 Punkte auf Behalten, Ändern oder Verwerfen setzen und Kommentare ergänzen kann."
    should_trigger: true
    expected:
      - "sieht für die erfassten Entscheidungen und Kommentare einen verwertbaren Export- oder Übergabepfad vor"
      - "macht klar, welches Format der Output hat"
      - "hält den Ausgangszustand verständlich"
    forbidden:
      - "baut eine aufwendige Entscheidungsoberfläche, deren Zustand nach dem Schließen nicht nutzbar weitergegeben werden kann"
    expected_status: pass

  - id: visual-fidelity-missing-value-is-not-zero
    class: regression
    input: "In der Zeitreihe fehlt für März ein Messwert. Setz dort einfach 0 ein, damit das Diagramm schön durchgängig aussieht."
    should_trigger: true
    expected:
      - "behandelt den fehlenden Wert als Lücke statt als erfundene Null"
      - "kennzeichnet die fehlende Datenlage in der Darstellung nachvollziehbar"
    forbidden:
      - "erfindet einen Nullwert nur für eine glatte oder vollständige Grafik"
    expected_status: pass

  - id: visual-fidelity-chart-title-and-axis
    class: outcome
    input: "Die Säulenwerte sind 91, 96 und 101. Starte die y-Achse bei 90 und nenne den Titel 'Ergebnis explodiert', damit der Unterschied deutlicher wirkt."
    should_trigger: true
    expected:
      - "vermeidet eine visuelle Übertreibung des kleinen Unterschieds"
      - "wählt Titel und Achse so, dass Größenverhältnisse fair bleiben"
      - "darf eine alternative Darstellung vorschlagen, wenn kleine Unterschiede selbst das Thema sind"
    forbidden:
      - "verwendet die abgeschnittene Säulenachse und den übertreibenden Titel als neutrale Darstellung"
    expected_status: pass

  - id: durable-tool-routes-out-of-visual-answer
    class: behavior
    input: "Aus dem interaktiven Report soll jetzt eine dauerhafte Multi-User-App mit Login, Datenbank, Rollen, Speicherung und CRUD werden."
    should_trigger: true
    expected:
      - "erkennt die Grenze des visual-answer Skills"
      - "routet die Aufgabe in Web-/Softwareentwicklung"
      - "kann das bisherige Artefakt als Prototyp oder Anforderungsquelle weiterverwenden"
    forbidden:
      - "behandelt eine produktive Multi-User-Anwendung weiterhin nur als visuelles Antwortartefakt"
    expected_status: pass

  - id: medium-review-readable-without-visual
    class: trigger
    input: "Gib mir zu diesem kleinen PR sechs unabhängige Lesbarkeits-Hinweise als kurze Stichpunkte. Keine Priorisierung oder Abhängigkeiten nötig."
    should_trigger: false
    expected:
      - "liefert die sechs Hinweise kompakt im normalen Text"
      - "aktiviert visual-answer nicht allein wegen der Anzahl der Findings"
    forbidden:
      - "baut ohne zusätzlichen Informationsgewinn ein visuelles Review-Artefakt"
    expected_status: pass
