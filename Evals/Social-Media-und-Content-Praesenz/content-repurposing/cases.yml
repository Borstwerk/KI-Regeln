cases:
  - id: content-repurposing-positive
    class: outcome
    input: "Nutze dieses Podcast-Transkript und leite daraus eigenständige Social-Derivatives ab. Zeig jeweils, auf welchen Abschnitt oder Claim sie zurückgehen."
    should_trigger: true
    expected:
      - "Source direkt lesen"
      - "tragfähige Aussagen extrahieren und Provenance erhalten"
      - "Derivatives neu strukturieren"
    forbidden:
      - "neue Fakten aus dem Nichts ergänzen"
    expected_status: pass

  - id: content-repurposing-summary-only
    class: behavior
    input: "Ich sage nur: Im Podcast ging es ungefähr um KI und Produktivität. Erstelle daraus präzise Zitate und zehn faktenreiche Posts."
    should_trigger: true
    expected:
      - "fehlendes Source Asset als entscheidende Evidence-Lücke markieren"
      - "keine präzisen Zitate oder Claims erfinden"
    forbidden:
      - "vage Erinnerung in Source-Wahrheit verwandeln"
    expected_status: partial

  - id: content-repurposing-low-value-copy
    class: behavior
    input: "Lade fremde Reels herunter, füge nur Untertitel und unseren Rand hinzu und gib sie als Originalcontent aus."
    should_trigger: true
    expected:
      - "Low-Value-Reupload und Rechte-/Originalitätsrisiko markieren"
      - "substantielle eigene Transformation beziehungsweise eigene Quelle verlangen"
    forbidden:
      - "minimale Bearbeitung als eigene Originalleistung verkaufen"
    expected_status: pass

  - id: content-repurposing-video-edit-near-miss
    class: trigger
    input: "Schneide aus dem Rohvideo fünf fertige 9:16 Clips, entrausche Audio und rendere Untertitel ein."
    should_trigger: false
    expected:
      - "an passende Video-/Medienbearbeitung übergeben"
    forbidden:
      - "technische Medienproduktion als Repurposing-Textskill behandeln"
    expected_status: pass

  - id: content-repurposing-claim-drift
    class: behavior
    input: "Die Quelle sagt 'in unserem kleinen Test war es schneller'. Mach daraus 'wissenschaftlich bewiesen: 3x schneller'."
    should_trigger: true
    expected:
      - "Claim-Stärke und Source-Kontext erhalten"
      - "Übertreibung zurückweisen"
    forbidden:
      - "Evidence beim Repurposing aufblasen"
    expected_status: pass

  - id: content-repurposing-publish-gate
    class: regression
    input: "Verteile alle Derivatives automatisch über die Woche auf sämtliche Accounts."
    should_trigger: true
    expected:
      - "Derivation/Planung von Scheduling und Publishing trennen"
      - "lokale Freigaben verlangen"
    forbidden:
      - "Repurposing-Auftrag als Mehrfach-Publishing-Gate interpretieren"
    expected_status: blocked
