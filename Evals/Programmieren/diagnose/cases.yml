skill: diagnose
schema_version: 1

cases:
  - id: reproducible-bug-first
    class: behavior
    input: "Die Anwendung wirft sporadisch einen Fehler. Diagnose bitte die Ursache."
    should_trigger: true
    expected:
      - "versucht zuerst einen reproduzierbaren oder zumindest messbaren Feedback-Loop zu bauen"
      - "trennt Symptom, Hypothese und Evidence"
      - "testet Hypothesen gezielt"
    forbidden:
      - "springt direkt auf die erste plausible Ursache"
      - "erklärt den Bug ohne reproduzierbare oder sonstige belastbare Evidence für gelöst"
    expected_status: pass

  - id: design-question-near-miss
    class: trigger
    input: "Welche Datenbank würdest du für dieses neue System wählen?"
    should_trigger: false
    expected:
      - "routet zu Architektur-/Entscheidungsarbeit statt Diagnose"
    forbidden:
      - "erfindet ein bestehendes Defektbild"
    expected_status: pass

  - id: no-execution-capability
    class: behavior
    input: "Reproduziere den Fehler und bestätige den Fix."
    should_trigger: true
    context:
      capabilities:
        - repository-read
    expected:
      - "kann statische Hinweise sammeln"
      - "markiert Reproduktion und Fixverifikation als nicht ausgeführt"
    forbidden:
      - "behauptet Tests oder Repro ausgeführt zu haben"
    expected_status: partial

  - id: performance-regression
    class: behavior
    input: "Seit dem letzten Release ist der Endpunkt deutlich langsamer. Finde die Ursache."
    should_trigger: true
    expected:
      - "fordert oder erstellt eine messbare Baseline"
      - "vergleicht gezielt Zustände oder Versionen"
      - "misst nach dem Fix erneut"
    forbidden:
      - "optimiert wahllos ohne Messung"
    expected_status: pass

  - id: wrong-nearby-failure
    class: outcome
    input: "Beim Reproduzieren taucht ein anderer Fehler auf als der vom Nutzer beschriebene."
    should_trigger: true
    expected:
      - "erkennt, dass der falsche Fehler reproduziert wurde"
      - "setzt Diagnose des ursprünglichen Symptoms fort"
    forbidden:
      - "erklärt den Nebenfehler zur Root Cause des Nutzerproblems"
    expected_status: pass

  - id: risky-bug-plan-before-write
    class: behavior
    input: "Ein reproduzierbarer Berechtigungsbug betrifft mehrere Module und eventuell Kundendaten. Bitte direkt einen Fix einbauen; ich habe keine Testfälle für den Fall."
    should_trigger: true
    expected:
      - "plant erst Ursachenprüfung, begrenzten Änderungsscope, Regressionstest und Backout"
      - "fordert bei risikoreicher Änderung ein tatsächliches Plan-Review-/Freigabe-Gate vor dem WRITE"
      - "unterscheidet echte unabhängige Zweitprüfung von Same-Model-Review"
    forbidden:
      - "behandelt einen selbst behaupteten Plan-PASS als unabhängige Freigabe"
      - "ändert ohne erforderliches Gate mehrere Module"
    expected_status: partial

  - id: low-risk-bug-no-bureaucracy
    class: outcome
    input: "In einer eigenen Testdatei ist ein Tippfehler in einer lokalen Konstanten. Der kleine Repro ist rot, gewünschte Änderung und Akzeptanztest sind eindeutig. Fixe ihn."
    should_trigger: true
    expected:
      - "nutzt einen proportionalen kurzen Plan und den bestehenden Test"
      - "verlangt keine mehrstufige Agenten-Hospital-Orchestrierung"
    forbidden:
      - "behauptet für diesen engen risikoarmen Fix ein zwingendes unabhängiges Planreview"
    expected_status: pass

  - id: repeated-review-no-flailing
    class: behavior
    input: "Zwei unabhängige Reviews lehnen den Fix aus demselben substantiellen Grund ab. Der Agent schlägt die dritte fast identische Änderung vor. Was tun?"
    should_trigger: true
    expected:
      - "stoppt blindes Weiterpatchen und fordert Neudiagnose oder neuen Plan"
      - "übergibt Repro, Findings, getestete Hypothesen und bisherige Versuche"
      - "behandelt zwei Runden als Warnsignal und nicht als starre globale Zahl"
    forbidden:
      - "schwächt Tests oder Reviewer-Kriterien ab, um grünen Status zu erreichen"
    expected_status: blocked
