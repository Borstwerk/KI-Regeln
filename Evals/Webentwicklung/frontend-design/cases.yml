skill: frontend-design
schema_version: 1

cases:
  - id: generic-saas-avoidance
    class: outcome
    input: "Entwirf eine Website für ein kleines analoges Buchbinderatelier. Sie soll eigenständig wirken und nicht wie eine SaaS-Landingpage."
    should_trigger: true
    expected:
      - "leitet die Designrichtung aus Produkt, Publikum und Zweck ab"
      - "formuliert eine erkennbare visuelle These"
      - "vermeidet unmotivierte SaaS-Standardmuster"
    forbidden:
      - "setzt automatisch KPI-Cards, lila Gradient und Dashboard-Hero ein"
      - "erfindet Kundenlogos, Kennzahlen oder Testimonials"
    expected_status: pass

  - id: small-css-fix-near-miss
    class: trigger
    input: "Der Button ist auf Mobile 4 Pixel zu breit. Korrigiere nur diesen CSS-Fehler."
    should_trigger: false
    expected:
      - "behandelt die Aufgabe als lokalen Frontend-Fix"
    forbidden:
      - "startet ungefragt eine neue Art Direction"
    expected_status: pass

  - id: paraphrased-art-direction
    class: trigger
    input: "Mach die Seite weniger KI-mäßig und gib ihr eine klare gestalterische Handschrift, die zum Produkt passt."
    should_trigger: true
    expected:
      - "erkennt den Bedarf an Art Direction ohne Skillnamen"
    forbidden:
      - "interpretiert weniger KI-mäßig nur als Entfernen einzelner Gradients"
    expected_status: pass

  - id: no-browser
    class: behavior
    input: "Gestalte die Seite neu und bestätige anschließend, dass sie auf Desktop und Mobile sauber aussieht."
    should_trigger: true
    context:
      capabilities:
        - repository-read
    expected:
      - "kann Designrichtung und Codearbeit planen oder durchführen"
      - "markiert gerenderte Verifikation ohne Browser als nicht durchgeführt"
    forbidden:
      - "behauptet Desktop-/Mobile-Rendering geprüft zu haben"
    expected_status: partial

  - id: accessibility-over-spectacle
    class: behavior
    input: "Die visuell starke Navigation ist per Tastatur nicht bedienbar. Beurteile, ob das Design freigegeben werden kann."
    should_trigger: true
    expected:
      - "behandelt Accessibility als hartes Qualitätsgate"
      - "verweigert Freigabe trotz visueller Qualität"
    forbidden:
      - "wertet Accessibility als optionale Politur"
    expected_status: pass

  - id: reference-board-decomposition
    class: behavior
    input: "Ich habe drei starke Referenzseiten gefunden. Eine hat großartige Typografie, eine interessante Scroll-Dramaturgie und die dritte eine ungewöhnliche Navigation. Entwickle daraus unsere Art Direction, ohne eine der Seiten einfach nachzubauen."
    should_trigger: true
    expected:
      - "zerlegt die Referenzen in übertragbare Prinzipien statt ganze Kompositionen zu kopieren"
      - "bindet die Auswahl an Produkt, Publikum und Aufgabe"
      - "benennt produktspezifische oder nicht zu übernehmende Merkmale"
      - "formuliert daraus eine eigenständige Designrichtung"
    forbidden:
      - "behandelt eine einzelne Referenz als faktische Implementierungsvorlage"
      - "kopiert fremde Markenmerkmale oder konkrete Assets als Default"
    expected_status: pass

  - id: novelty-budget-over-spectacle
    class: behavior
    input: "Die Landingpage hat bereits eine starke 3D-Produktjourney. Ergänze außerdem noch Parallax, ein Minigame, eine interaktive Bilderwand, einen animierten Cursor und einen Scroll-Soundeffekt, weil das Modell all das bauen kann."
    should_trigger: true
    expected:
      - "prüft jeden zusätzlichen Effekt gegen Informations-, Produkt- oder Identitätsnutzen"
      - "behandelt technische Machbarkeit nicht als Designbegründung"
      - "priorisiert wenige Signature Experiences und schützt die visuelle Hierarchie"
      - "kann überflüssige Gimmicks explizit ablehnen"
    forbidden:
      - "interpretiert mehr Interaktivität automatisch als bessere Art Direction"
    expected_status: pass

