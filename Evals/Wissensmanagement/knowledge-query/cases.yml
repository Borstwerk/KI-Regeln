schema_version: 1
cases:
  - id: query-grounded-positive
    class: behavior
    input: "Was sagt unsere Wissensbasis zur aktuellen Authentifizierungsarchitektur?"
    should_trigger: true
    expected:
      - "retrieved relevante Einheiten und prüft Provenance/Aktualität"
      - "kennzeichnet Konflikte oder Lücken"
    forbidden:
      - "antwortet nur aus Modellwissen"
    expected_status: pass
  - id: query-no-hit
    class: regression
    input: "Die semantische Suche findet nichts. Also existiert dazu sicher kein Wissen, richtig?"
    should_trigger: true
    expected:
      - "probiert geeignete weitere Retrievalwege oder qualifiziert die Aussage"
    forbidden:
      - "setzt einen leeren Retrievaltreffer mit sicherer Abwesenheit gleich"
    expected_status: pass
  - id: query-current-external-near-miss
    class: trigger
    input: "Wie ist heute der aktuelle Börsenkurs von Firma X?"
    should_trigger: false
    expected:
      - "nutzt aktuelle externe Recherche statt persistente KB als Primärweg"
    forbidden:
      - "behandelt eine dynamische Live-Frage als reine Knowledge-Base-Abfrage"
    expected_status: pass

  - id: reranker-cannot-recover-missing-candidate
    class: behavior
    input: "Unser Reranker ist sehr gut, aber die korrekte Quelle taucht nie unter den ersten 100 Retrieval-Kandidaten auf. Optimiere nur die Reranker-Gewichte weiter."
    should_trigger: true
    expected:
      - "erkennt Candidate Generation als vorgelagerten Bottleneck"
      - "trennt Candidate Recall von Reranking-Qualität"
      - "empfiehlt zuerst die Kandidatenabdeckung zu prüfen"
    forbidden:
      - "behauptet, ein besserer Reranker könne eine nicht vorhandene Quelle zurückholen"
    expected_status: pass

  - id: staged-retrieval-evaluation
    class: outcome
    input: "Wir haben ein zweistufiges Suchsystem. Wie prüfen wir, ob der Fehler im Retrieval oder im Ranking liegt?"
    should_trigger: true
    expected:
      - "misst Kandidatenabdeckung beziehungsweise Recall vor dem Reranking"
      - "bewertet die Sortierung der vorhandenen Kandidaten separat"
      - "vermeidet eine universelle Empfehlung für CLIP, FAISS oder feste Gewichtungen"
    forbidden:
      - "reduziert beide Stufen auf einen einzigen undiagnostizierten Score"
    expected_status: pass

