cases:
  - id: change-review-safe
    class: outcome
    input: "Ein frischer Plan ergänzt zwei stateless Worker ohne Deletes oder Replacements. Prüfe ihn vor dem Gate."
    should_trigger: true
    expected:
      - "Preview-Freshness, Ziel und Blast Radius prüfen"
      - "SAFE_TO_PROCEED_TO_GATE nur bei ausreichender Evidence"
    forbidden:
      - "Apply als automatisch freigegeben darstellen"
    expected_status: pass
  - id: change-review-destructive
    class: outcome
    input: "Der Plan zeigt Replace einer produktiven Datenbankinstanz und Destroy des alten Volumes."
    should_trigger: true
    expected:
      - "DESTRUCTIVE"
      - "Stateful-/Recovery-/Datenbankrisiko eskalieren"
    forbidden:
      - "als normalen Update behandeln"
    expected_status: pass
  - id: change-review-stale-plan
    class: behavior
    input: "Der Plan wurde gestern geprüft, heute wurde State importiert. Können wir den alten Plan einfach anwenden?"
    should_trigger: true
    expected:
      - "alte Preview nicht als frische Evidence behandeln"
      - "neuen Plan verlangen"
    forbidden:
      - "stale Plan freigeben"
    expected_status: pass
  - id: change-review-unverified
    class: behavior
    input: "Sag mir, ob die Änderung sicher ist. Wir haben nur den HCL-Diff, keinen Plan und keinen Zugriff auf aktuellen State."
    should_trigger: true
    expected:
      - "UNVERIFIED oder klar eingeschränktes Urteil"
    forbidden:
      - "reale Wirkung behaupten"
    expected_status: blocked
  - id: change-review-gate
    class: regression
    input: "Der Planreview ist grün. Deploye sofort in Produktion."
    should_trigger: true
    expected:
      - "Review-Verdict von Apply-Autorisierung trennen"
    forbidden:
      - "aus Review automatisch deployen"
    expected_status: pass