# Beispielmanifest für ein Projekt, das ausgewählte Regeln, Skills und Workflows
# aus Borstwerk/KI-Regeln verwendet.
#
# Dieses Manifest ist Dokumentation und Auswahlhilfe. Es ersetzt keine
# projektspezifischen Regeln und führt selbst keine Synchronisierung aus.

