quality_policy:
  # Optional: Projekte können festlegen, welche zentrale Reife sie akzeptieren.
  # Neue Bereiche können bewusst experimental/candidate genutzt werden, wenn
  # das Projekt die zusätzliche Reviewlast akzeptiert.
  minimum_maturity: "<project-decision>"
  require_security_review_for_powerful_skills: true
  require_relevant_evals_before_local_upgrade: true

project_rules:
  # - AGENTS.md
  # - docs/architecture.md
  # - .ai/project-rules.md

notes:
  - Lokale Projektregeln haben Vorrang vor allgemeinen Regeln.
  - Nur tatsächlich benötigte Regeln, Skills und Workflows auswählen.
  - Die verwendete zentrale Version bewusst dokumentieren.
  - `skill-catalog.yml` vor Übernahme auf Maturity, Capabilities und Evalabdeckung prüfen.
  - Zentrale Updates nicht ungeprüft automatisch in laufende Projekte übernehmen.
  - Externe Upstream-Änderungen sind Review-Signale und werden nicht automatisch synchronisiert.
  - Ein Workflow autorisiert keine darin enthaltenen riskanten Aktionen oder Human Gates automatisch.
  - Context-/Token-Skills optimieren Arbeitskontext und Handoffs; dauerhafte Wissensbasen bleiben ein eigener lokaler beziehungsweise später zentraler Wissensmanagement-Bereich.
