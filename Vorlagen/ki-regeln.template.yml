  # - AGENTS.md
  # - docs/architecture.md
  # - .ai/project-rules.md

# Optionale projektspezifische Requirements-Wahrheit. Werte nie aus den zentralen
# KI-Regeln ableiten, sondern nur aus lokalen Stakeholdern, Sources und Entscheidungen.
requirements_context:
  stakeholders_and_owners: []
  goals_and_needs: []
  authoritative_sources: []
  scope_and_non_goals: []
  constraints: []
  confirmed_quality_targets: []
  assumptions_and_open_decisions: []
  approval_and_baseline_policy: "<project-specific>"

# Optionale projektspezifische Architekturwahrheit. Werte nie aus den zentralen
# KI-Regeln ableiten, sondern nur aus lokaler Spezifikation, Evidence und Entscheidungen.
architecture_context:
  drivers: []
  constraints: []
  system_boundary: "<project-specific>"
  external_systems: []
  ownership_and_sources_of_truth: []
  quality_attribute_targets: []
  accepted_decisions_or_adrs: []
  migration_and_cutover_constraints: []

notes:
  - Lokale Projektregeln haben Vorrang vor allgemeinen Regeln.
  - Nur tatsächlich benötigte Regeln, Skills und Workflows auswählen.
  - Die verwendete zentrale Version bewusst dokumentieren.
  - `skill-catalog.yml` vor Übernahme auf Maturity, Capabilities und Evalabdeckung prüfen.
  - Zentrale Updates nicht ungeprüft automatisch in laufende Projekte übernehmen.
  - Externe Upstream-Änderungen sind Review-Signale und werden nicht automatisch synchronisiert.
  - Ein Workflow autorisiert keine darin enthaltenen riskanten Aktionen oder Human Gates automatisch.
  - Context-/Token-Skills optimieren Active Context und taskbezogenen Working State; dauerhaft gepflegtes Wissen gehört zum Bereich `Wissensmanagement/`.
  - Knowledge-Base-Tools, Taxonomien, Datenschutzklassen und Sources of Truth bleiben projektspezifisch.
  - Schnittstellen-Standards, Frameworks, reale Consumer, Versionierungs-Policies und Release-/Deprecation-Gates bleiben projektspezifisch.
  - Infrastrukturtools, Provider, Accounts/Cluster, State-Backends, Credentials, Environment-Policies, Health-Schwellen und Deploy-/Destroy-Gates bleiben projektspezifisch.
  - Preview, Plan oder CI-Grün autorisieren keine reale Infrastrukturänderung automatisch.
  - SLO-Werte, Alert-Schwellen, Severity-/On-Call-Modelle, RTO/RPO, Capacity Limits, Recovery-/Failover-Regeln und konkrete Observability-Tools bleiben projektspezifisch.
  - Ein Incident oder Resilience-Experiment erweitert keine Produktionsrechte. Fault Injection, Restart, Failover, Restore, Traffic Switch und andere reale Betriebsaktionen bleiben lokal gated.
  - Data-Engineering-Sources of Truth, fachlicher Grain, Qualitäts-/Reconciliation-Regeln, Freshness-Semantik, Retention, Data-Contract-Zusagen und Consumer bleiben projektspezifisch.
  - Toolwahl für Orchestrierung, Streaming, Transformation, Storage und Lineage bleibt projektspezifisch; Airflow, dbt, Kafka, Beam, Spark oder OpenLineage sind keine zentralen Pflichtdefaults.
  - Publish, Backfill, Replay, Offset-/Cursor-Reset, Partition-Replace und andere reale Datenänderungen bleiben lokal gated. Ein grüner DAG oder Quality Check autorisiert diese Aktionen nicht automatisch.
  - Architecture Drivers, Constraints, Quality-Ziele, Systemgrenzen, Ownership, akzeptierte ADRs und Migrations-/Cutover-Bedingungen bleiben projektspezifisch.
  - Microservices, DDD, Hexagonal, Event-driven, CQRS, Event Sourcing oder Cloud sind keine zentralen Pflichtarchitekturen.
  - Ein Architektur-Verdict oder `READY_FOR_LOCAL_GATE` autorisiert keine Codeänderung, Migration, Traffic-Umschaltung, Deployment oder Release automatisch.
  - Stakeholder, Goals, Requirements Sources, Scope, Prioritäten, Quality-Ziele, Approval-/Baseline-Regeln und verbindliche Constraints bleiben projektspezifisch.
  - PRD, BRD, SRS, User Stories, Given/When/Then, EARS, MoSCoW oder numerische Clarity-Scores sind keine zentralen Pflichtformate oder Freigaberegeln.
  - Requirements Validation, `APPROVED` oder `READY_FOR_LOCAL_GATE` autorisieren keine Architektur-, Code-, Daten-, Contract-, Deployment- oder Releaseaktion automatisch.
