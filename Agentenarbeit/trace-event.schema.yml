schema_version: 2

required:
  - timestamp
  - event_type
  - task_id
  - run_id
  - status

optional:
  - parent_run_id
  - skill_id
  - workflow_id
  - phase
  - tool_type
  - operation
  - duration_ms
  - input_tokens
  - output_tokens
  - cache_read_input_tokens
  - cache_write_input_tokens
  - context_size
  - context_size_unit
  - tool_output_size
  - tool_output_size_unit
  - compaction_ratio
  - context_ref
  - handoff_ref
  - artifact_ref
  - evidence_ref
  - gate_id
  - scope_ref
  - error_code
  - note

allowed_status:
  - started
  - pass
  - fail
  - blocked
  - partial
  - approved
  - rejected

recommended_event_types:
  - TASK_STARTED
  - SKILL_ACTIVATED
  - WORKFLOW_PHASE_STARTED
  - TOOL_CALLED
  - TOOL_FAILED
  - CONTEXT_AUDITED
  - CONTEXT_COMPACTED
  - HANDOFF_CREATED
  - EVIDENCE_RECORDED
  - VALIDATION_PASSED
  - VALIDATION_FAILED
  - GATE_REQUESTED
  - GATE_APPROVED
  - GATE_REJECTED
  - SCOPE_CHANGED
  - FALLBACK_USED
  - TASK_BLOCKED
  - TASK_COMPLETED
  - TASK_FAILED

usage_rules:
  provider_reported_tokens_preferred: true
  approximations_must_be_marked: true
  token_reduction_is_not_quality_proof: true

privacy:
  content_fields_default: omitted
  secrets: forbidden
  full_prompt_or_tool_content: opt-in-only
  compaction_or_handoff_content: opt-in-only

example:
  timestamp: "2026-08-23T19:30:00+02:00"
  event_type: CONTEXT_COMPACTED
  task_id: TASK-42
  run_id: RUN-7
  skill_id: context-compaction
  status: pass
  input_tokens: 82000
  output_tokens: 1400
  compaction_ratio: 0.18
  context_ref: "artifact://context/compacted-7"
  evidence_ref: "eval://handoff-continuation/7"
