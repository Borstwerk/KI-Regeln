schema_version: 1
source_registry: Dokumentation/upstream-sources.yml
last_reviewed: 2026-08-25

# Provenance is intentionally separate from mutable-upstream monitoring.
# Every concrete GitHub artifact in upstream-sources.yml has a source-specific
# record here. Phase 1 does not infer historical licensing from a repository's
# current license. The registry pins the observed artifact blob, but a matching
# repository commit plus license file from the same historical state was not
# established for these records. Therefore redistribution remains unresolved.
defaults:
  use_class: reference/inspiration
  license_spdx: UNKNOWN
  license_source: null
  license_status_at_observation: unresolved
  notice_requirement: none-for-reference-only
  redistribution_status: unresolved

