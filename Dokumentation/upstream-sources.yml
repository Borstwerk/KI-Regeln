# Mutable external sources whose changes may affect local rules or skills.
# A changed upstream is a review signal, never an automatic sync instruction.
#
# monitor_mode:
#   exact-sha       -> compare a GitHub file blob SHA
#   semantic-review -> reopen a living web page and review relevant concepts
#
# cadence:
#   monthly         -> check on every monthly maintenance run
#   quarterly       -> check when a quarterly review is due

